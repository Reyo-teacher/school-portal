<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика — Портал Логунова Г.В.</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.25);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 900px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .tile-link {
            background: rgba(30, 41, 59, 0.9);
            border: 1.5px solid var(--border-color);
            padding: 18px 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        .tile-link:hover, .tile-link:active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .tile-link.ent {
            background: rgba(14, 165, 233, 0.25);
            border-color: var(--accent);
            color: var(--accent);
            grid-column: span 2;
        }

        .back-btn {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #0f172a; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Логунов Григорий Владимирович — Математика</h1>
    </header>

    <div class="card">
        <a href="index.html" class="back-btn">← На главную</a>
        <h2>Выберите класс или направление</h2>
        <div class="grid-tiles">
            <a href="#" onclick="alert('Материалы 5 класса в разработке'); return false;" class="tile-link">5 класс</a>
            <a href="#" onclick="alert('Материалы 6 класса в разработке'); return false;" class="tile-link">6 класс</a>
            <a href="#" onclick="alert('Материалы 7 класса в разработке'); return false;" class="tile-link">7 класс</a>
            <a href="#" onclick="alert('Материалы 8 класса в разработке'); return false;" class="tile-link">8 класс</a>
            <a href="#" onclick="alert('Материалы 9 класса в разработке'); return false;" class="tile-link">9 класс</a>
            <a href="#" onclick="alert('Материалы 10 класса в разработке'); return false;" class="tile-link">10 класс</a>
            <a href="#" onclick="alert('Материалы 11 класса в разработке'); return false;" class="tile-link">11 класс</a>
            <a href="ent.html" class="tile-link ent">🎯 ЕНТ Подготовка</a>
        </div>
    </div>
</div>

</body>
</html>
