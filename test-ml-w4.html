<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 4: Проценты, сплавы и смеси — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 4</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Проценты, сплавы и смеси</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm"></div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Общий рейтинг школы (Неделя 4):</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Загрузка рейтинга...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwk6LbGQb8yiUnozyt7uOshLK79-EB52HEYA6-PfkjvJILON8zR41JkdTgM0apg7OHJ/exec";
    const CURRENT_WEEK = "Неделя 4";

    const questionPool = [
        {
            q: "1. Смешали 300 г раствора с концентрацией соли 20% и 500 г раствора с концентрацией соли 40%. Найдите концентрацию соли в полученном растворе.",
            o: ["30%", "32.5%", "35%", "37.5%"],
            a: "32.5%",
            sol: "Масса соли в первом растворе: 300 * 0,2 = 60 г. Во втором: 500 * 0,4 = 200 г. Общая масса соли: 60 + 200 = 260 г. Общая масса раствора: 300 + 500 = 800 г. Концентрация: (260 / 800) * 100% = 32,5%."
        },
        {
            q: "2. Цену товара сначала повысили на 20%, а затем снизили на 20%. Как изменилась первоначальная цена товара?",
            o: ["Не изменилась", "Уменьшилась на 2%", "Увеличилась на 4%", "Уменьшилась на 4%"],
            a: "Уменьшилась на 4%",
            sol: "Пусть цена 100. После повышения: 100 * 1,2 = 120. После снижения: 120 * (1 - 0,2) = 120 * 0,8 = 96. Цена стала 96, то есть уменьшилась на 4%."
        },
        {
            q: "3. В классе 30 учеников, из них 12 девочек. Какой процент составляют мальчики?",
            o: ["40%", "50%", "60%", "70%"],
            a: "60%",
            sol: "Количество мальчиков: 30 - 12 = 18. Процент мальчиков: (18 / 30) * 100% = 0,6 * 100% = 60%."
        },
        {
            q: "4. Сплав содержит 30 кг меди и 20 кг цинка. Каков процентный состав цинка в сплаве?",
            o: ["30%", "40%", "50%", "60%"],
            a: "40%",
            sol: "Общая масса сплава: 30 + 20 = 50 кг. Процент цинка: (20 / 50) * 100% = 0,4 * 100% = 40%."
        },
        {
            q: "5. Сколько чистой воды нужно добавить к 400 г раствора с концентрацией соли 15%, чтобы получить раствор с концентрацией 10%?",
            o: ["150 г", "200 г", "250 г", "300 г"],
            a: "200 г",
            sol: "Масса соли в исходном растворе: 400 * 0,15 = 60 г. Пусть масса новой воды x. Новая масса раствора: 400 + x. Концентрация: 60 / (400 + x) = 0,1 ⇒ 400 + x = 600 ⇒ x = 200 г."
        },
        {
            q: "6. Товар стоил 8000 тенге. После уценки он стал стоить 6800 тенге. На сколько процентов была снижена цена товара?",
            o: ["10%", "12%", "15%", "20%"],
            a: "15%",
            sol: "Величина скидки: 8000 - 6800 = 1200 тенге. Процент снижения: (1200 / 8000) * 100% = 0,15 * 100% = 15%."
        },
        {
            q: "7. Имеются два сплава золота и серебра. Первый содержит 40% золота, а второй — 60% золота. В каком соотношении надо взять первый и второй сплавы, чтобы получить сплав, содержащий 50% золота?",
            o: ["1 : 1", "1 : 2", "2 : 3", "3 : 4"],
            a: "1 : 1",
            sol: "По правилу креста (Пирсона): разности равны (60 - 50 = 10) и (50 - 40 = 10). Соотношение 10 : 10 = 1 : 1."
        },
        {
            q: "8. Банк выплачивает вкладчикам 15% годовых. Вкладчик положил на счет 200 000 тенге. Какая сумма будет на счете через год?",
            o: ["220 000 тг", "230 000 тг", "240 000 тг", "250 000 тг"],
            a: "230 000 тг",
            sol: "Прибыль за год: 200 000 * 0,15 = 30 000 тенге. Итоговая сумма: 200 000 + 30 000 = 230 000 тенге."
        },
        {
            q: "9. Смешали 2 кг 10%-го раствора кислоты и 3 кг 20%-го раствора кислоты. Какова концентрация получившейся смеси?",
            o: ["14%", "15%", "16%", "17%"],
            a: "16%",
            sol: "Чистая кислота: 2 * 0,1 + 3 * 0,2 = 0,2 + 0,6 = 0,8 кг. Общая масса: 2 + 3 = 5 кг. Концентрация: (0,8 / 5) * 100% = 0,16 * 100% = 16%."
        },
        {
            q: "10. Число a составляет 80% от числа b. Сколько процентов число b составляет от числа a?",
            o: ["110%", "120%", "125%", "130%"],
            a: "125%",
            sol: "Пусть b = 100, тогда a = 80. Процент b от a: (100 / 80) * 100% = 1,25 * 100% = 125%."
