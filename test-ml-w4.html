<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 4: Анализ данных и статистика — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 4</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Анализ данных, среднее значение и медиана</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Лучшие результаты недели 4:</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Динамически заполняется -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const questionPool = [
        {
            q: "1. Среднее арифметическое 5 чисел равно 12. Если добавить шестое число, среднее стало равным 14. Найдите шестое число.",
            svg: `<svg width="160" height="60" viewBox="0 0 160 60"><rect x="10" y="15" width="140" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="80" y="35" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">Ср. знач. 5ч = 12 → 14</text></svg>`,
            o: ["20", "22", "24", "26"],
            a: "24",
            sol: "Сумма 5 чисел равна 5 × 12 = 60. Сумма 6 чисел равна 6 × 14 = 84. Шестое число: 84 - 60 = 24."
        },
        {
            q: "2. Дан ряд чисел: 4, 7, 10, 4, 12, 15, 4. Найдите моду этого ряда.",
            o: ["4", "7", "10", "12"],
            a: "4",
            sol: "Мода — это значение, которое встречается в ряду чаще всего. Число 4 повторяется 3 раза, остальные реже. Мода равна 4."
        },
        {
            q: "3. Найдите медиану упорядоченного ряда чисел: 3, 5, 8, 12, 15, 20.",
            o: ["8", "9", "10", "12"],
            a: "10",
            sol: "Количество чисел четное (6 чисел). Медиана равна среднему арифметическому двух центральных чисел (8 и 12): (8 + 12) / 2 = 10."
        },
        {
            q: "4. Найдите размах ряда чисел: 12, 25, 8, 34, 17.",
            o: ["24", "26", "28", "30"],
            a: "26",
            sol: "Размах ряда — это разница между наибольшим и наименьшим значениями. Наибольшее = 34, наименьшее = 8. Размах = 34 - 8 = 26."
        },
        {
            q: "5. Среднее арифметическое четырех чисел равно 16. Три из них равны 12, 15 и 20. Найдите четвертое число.",
            o: ["15", "17", "19", "21"],
            a: "17",
            sol: "Сумма четырех чисел: 4 × 16 = 64. Сумма известных трех: 12 + 15 + 20 = 47. Четвертое число: 64 - 47 = 17."
        },
        {
            q: "6. В ряду чисел 5, 8, x, 12, 15 медиана равна 10. Найдите значение x.",
            o: ["9", "10", "11", "13"],
            a: "10",
            sol: "Ряд содержит 5 элементов и уже упорядочен. Медианой является ровно средний элемент (третий по счету), то есть x. По условию медиана равна 10, значит x = 10."
        },
        {
            q: "7. Найдите среднее арифметическое чисел: -4, 0, 3, 7, 9.",
            o: ["2", "3", "4", "5"],
            a: "3",
            sol: "Сумма чисел: (-4) + 0 + 3 + 7 + 9 = 15. Делим на количество элементов (5): 15 / 5 = 3."
        },
        {
            q: "8. Найдите моду ряда: 2, 3, 3, 5, 5, 5, 7, 8, 8.",
            o: ["3", "5", "7", "8"],
            a: "5",
            sol: "Число 5 встречается 3 раза, что больше любого другого числа в данном ряду. Следовательно, мода равна 5."
        },
        {
            q: "9. Ученик получил за тесты следующие оценки: 3, 4, 4, 4, 4, 5, 5. Найдите моду этого ряда оценок.",
            o: ["3", "4", "4.5", "5"],
            a: "4",
            sol: "Оценка 4 встречается 4 раза, что является наибольшей частотой среди всех оценок. Мода равна 4."
        },
        {
            q: "10. Средняя зарплата 10 работников составляет 150 000 тенге, а зарплата еще 5 работников — 210 000 тенге. Найдите среднюю зарплату всех 15 работников.",
            o: ["160 000 тг", "170 000 тг", "180 000 тг", "190 000 тг"],
            a: "170 000 тг",
            sol: "Общий фонд оплаты труда: (10 × 150000) + (5 × 210000) = 1 500 000 + 1 050 000 = 2 550 000 тг. Делим на общее число работников (15): 2550000 / 15 = 170 000 тенге."
        },
        {
            q: "11. Как называется разность между наибольшим и наименьшим значениями результатов измерений?",
            o: ["Медиана", "Мода", "Размах", "Среднее арифметическое"],
            a: "Размах",
            sol: "По определению в статистике разность между наибольшим и наименьшим элементами выборки называется размахом."
        },
        {
            q: "12. Найдите медиану ряда чисел: 14, 2, 8, 20, 6, 11.",
            o: ["8.5", "9.5", "10", "10.5"],
            a: "9.5",
            sol: "Упорядочим ряд по возрастанию: 2, 6, 8, 11, 14, 20. Две центральные цифры — 8 и 11. Медиана = (8 + 11) / 2 = 9.5."
        },
        {
            q: "13. Велосипедист первую половину пути ехал со скоростью 60 км/ч, а вторую половину — со скоростью 40 км/ч. Найдите среднюю скорость на всем пути.",
            o: ["48 км/ч", "50 км/ч", "52 км/ч", "45 км/ч"],
            a: "48 км/ч",
            sol: "Для равных участков пути средняя скорость находится через гармоническое среднее: 2v₁v₂ / (v₁ + v₂). Подставляем: (2 × 60 × 40) / (60 + 40) = 4800 / 100 = 48 км/ч."
        },
        {
            q: "14. В таблице частот значение 5 встречается 3 раза, значение 7 — 5 раз, значение 10 — 2 раза. Найдите среднее взвешенное значение.",
            o: ["6.5", "7.0", "7.5", "8.0"],
            a: "7.0",
            sol: "Сумма значений с учетом частот: (5 × 3) + (7 × 5) + (10 × 2) = 15 + 35 + 20 = 70. Общая сумма частот: 3 + 5 + 2 = 10. Среднее = 70 / 10 = 7."
        },
        {
            q: "15. Сумма 8 чисел равна 96. Найдите их среднее арифметическое.",
            o: ["10", "11", "12", "14"],
            a: "12",
            sol: "Среднее арифметическое равно делению суммы всех чисел на их количество: 96 / 8 = 12."
        },
        {
            q: "16. Найдите размах ряда температур: -5, -2, 3, 7, 12.",
            o: ["12", "14", "17", "19"],
            a: "17",
            sol: "Наибольшее значение = 12, наименьшее = -5. Размах = 12 - (-5) = 12 + 5 = 17."
        },
        {
            q: "17. Если к каждому члену числового ряда прибавить число 5, то как изменится его среднее арифметическое?",
            o: ["Увеличится в 5 раз", "Увеличится на 5", "Не изменится", "Увеличится на 5 раз"],
            a: "Увеличится на 5",
            sol: "Свойство среднего арифметического: при прибавлении константы к каждому элементу ряда среднее арифметическое увеличивается на ту же константу."
        },
        {
            q: "18. Если каждый элемент числового ряда умножить на 3, то как изменится размах этого ряда?",
            o: ["Не изменится", "Увеличится на 3", "Увеличится в 3 раза", "Увеличится в 9 раз"],
            a: "Увеличится в 3 раза",
            sol: "При умножении всех элементов на положительное число размах (как и любая мера разброса) увеличивается ровно в это же число раз."
        },
        {
            q: "19. Что является медианой упорядоченного по возрастанию ряда, состоящего из 9 нечетных чисел?",
            o: ["Четвертое число", "Пятое число", "Среднее между 4 и 5", "Шестое число"],
            a: "Пятое число",
            sol: "Для ряда из 9 элементов ровно по 4 элемента остаются слева и справа от центрального элемента. Пятый элемент является медианой."
        },
        {
            q: "20. В группе из 20 студентов рост 12 мальчиков в среднем составляет 175 см, а рост 8 девочек в среднем — 165 см. Найдите средний рост всех студентов группы.",
            o: ["170 см", "171 см", "172 см", "173 см"],
            a: "171 см",
            sol: "Суммарный рост всех студентов: (12 × 175) + (8 × 165) = 2100 + 1320 = 3420 см. Делим на общее количество студентов (20): 3420 / 20 = 171 см."
        }
    ];

    let activeQuestions = [];
    const STORAGE_KEY = 'leaderboard_ml_w4';

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToLeaderboard(name, score) {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        board.push({ name: name, score: score, date: new Date().toLocaleDateString() });
        board.sort((a, b) => b.score - a.score);
        board = board.slice(0, 10);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
        loadLeaderboard();
    }

    function loadLeaderboard() {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let tbody = document.getElementById('leaderboardBody');
        
        if (!tbody) return;

        if (board.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
            return;
        }

        let html = '';
        board.forEach((item, index) => {
            let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
            html += `<tr>`;
            html += `<td>${medal}${index + 1}</td>`;
            html += `<td style="font-weight: 500;">${item.name}</td>`;
            html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
            html += `</tr>`;
        });
        tbody.innerHTML = html;
    }
</script>

</body>
</html>
