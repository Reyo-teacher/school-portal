<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёры — Портал Логунова Г.В.</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(52, 211, 153, 0.25);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(52, 211, 153, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 211, 153, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 900px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .grid-trainers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .trainer-tile {
            background: rgba(30, 41, 59, 0.9);
            border: 1.5px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            display: block;
            box-sizing: border-box;
        }
        .trainer-tile:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 211, 153, 0.3);
        }
        .trainer-tile h3 { margin: 0 0 8px 0; font-size: 16px; }
        .trainer-tile p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .trainer-tile:hover p { color: #1e293b; }

        .back-btn {
            display: inline-block;
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
        }
        .back-btn:hover { background: var(--accent); color: #0f172a; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Логунов Григорий Владимирович — Тренажёры</h1>
    </header>

    <div class="card">
        <a href="math.html" class="back-btn">← Назад к выбору разделов</a>
        <h2>Выберите интерактивный тренажёр</h2>
        <div class="grid-trainers">
            <a href="trainer-mult.html" class="trainer-tile">
                <h3>✖️ Таблица умножения</h3>
                <p>Тренажёр на скорость и знание таблицы умножения.</p>
            </a>
            <!-- Здесь в будущем можно будет легко добавлять новые тренажёры -->
            <a href="#" onclick="alert('Этот тренажёр появится в следующем обновлении!'); return false;" class="trainer-tile" style="opacity: 0.6;">
                <h3>📐 Уравнения и корни</h3>
                <p>Скоро появится...</p>
            </a>
        </div>
    </div>
</div>

</body>
</html>
