<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 8: Движение и работа — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { кг color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 8</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Текстовые задачи на движение и работу</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Лучшие результаты недели 8:</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Динамически заполняется -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const questionPool = [
        {
            q: "1. Расстояние между городами А и Б автомобиль проезжает за 3 часа со скоростью 80 км/ч. С какой скоростью должен ехать автомобиль, чтобы преодолеть это же расстояние за 2 часа?",
            svg: `<svg width="160" height="60" viewBox="0 0 160 60"><rect x="10" y="15" width="140" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="80" y="35" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">S = 3ч × 80 км/ч = 240 км</text></svg>`,
            o: ["100 км/ч", "110 км/ч", "120 км/ч", "130 км/ч"],
            a: "120 км/ч",
            sol: "Сначала найдем расстояние: S = 3 × 80 = 240 км. Чтобы проехать 240 км за 2 часа, нужна скорость: V = 240 / 2 = 120 км/ч."
        },
        {
            q: "2. Первый рабочий может выполнить заказ за 6 часов, а второй — за 3 часа. За сколько часов они выполнят этот заказ при совместной работе?",
            o: ["1 час", "2 часа", "2.5 часа", "3 часа"],
            a: "2 часа",
            sol: "Производительность первого: 1/6 заказа в час. Производительность второго: 1/3 заказа в час. Совместная производительность: 1/6 + 1/3 = 3/6 = 1/2 заказа в час. Время совместной работы: 1 / (1/2) = 2 часа."
        },
        {
            q: "3. Лодка плывет по течению реки со скоростью 18 км/ч, а против течения — со скоростью 12 км/ч. Найдите скорость течения реки.",
            o: ["2 км/ч", "3 км/ч", "4 км/ч", "5 км/ч"],
            a: "3 км/ч",
            sol: "Скорость течения равна полуразности скорости по течению и против течения: (18 - 12) / 2 = 6 / 2 = 3 км/ч."
        },
        {
            q: "4. Два поезда движутся навстречу друг другу со скоростями 60 км/ч и 80 км/ч. Какое расстояние будет между ними через 2 часа, если в начальный момент расстояние составляло 400 км?",
            o: ["100 км", "120 км", "140 км", "160 км"],
            a: "120 км",
            sol: "Скорость сближения: 60 + 80 = 140 км/ч. За 2 часа поезда сблизятся на 140 × 2 = 280 км. Оставшееся расстояние: 400 - 280 = 120 км."
        },
        {
            q: "5. Бассейн наполняется через первую трубу за 4 часа, а через вторую — за 6 часов. Какая часть бассейна останется незаполненной через 2 часа совместной работы обеих труб?",
            o: ["1/12", "1/6", "1/4", "1/3"],
            a: "1/6",
            sol: "Совместная производительность труб: 1/4 + 1/6 = 5/12 бассейна в час. За 2 часа заполнится: 2 × (5/12) = 10/12 = 5/6 бассейна. Незаполненная часть: 1 - 5/6 = 1/6."
        },
        {
            q: "6. Катер прошел расстояние между двумя пристанями по течению реки за 3 часа, а обратно — за 4 часа. Найдите собственную скорость катера, если скорость течения реки равна 2 км/ч.",
            o: ["12 км/ч", "14 км/ч", "16 км/ч", "18 км/ч"],
            a: "14 км/ч",
            sol: "Пусть собственная скорость катера x. Путь туда: 3(x + 2). Путь обратно: 4(x - 2). Приравняем расстояния: 3x + 6 = 4x - 8 ⇒ x = 14 км/ч."
        },
        {
            q: "7. Из одного пункта в одном направлении одновременно выехали два автомобиля со скоростями 70 км/ч и 90 км/ч. Через сколько часов расстояние между ними будет равно 60 км?",
            o: ["2 часа", "2.5 часа", "3 часа", "4 часа"],
            a: "3 часа",
            sol: "Скорость удаления равна разности скоростей: 90 - 70 = 20 км/ч. Время t = 60 / 20 = 3 часа."
        },
        {
            q: "8. Бригада из 6 рабочих может покрасить забор за 10 дней. За сколько дней покрасят тот же забор 4 рабочих (при той же производительности)?",
            o: ["12 дней", "14 дней", "15 дней", "18 дней"],
            a: "15 дней",
            sol: "Объем работы в человеко-днях: 6 × 10 = 60 человеко-дней. Для 4 рабочих потребуется: 60 / 4 = 15 дней."
        },
        {
            q: "9. Автомобиль проехал первую половину пути со скоростью 60 км/ч, а вторую половину — со скоростью 90 км/ч. Найдите среднюю скорость автомобиля на всем пути.",
            o: ["72 км/ч", "75 км/ч", "78 км/ч", "80 км/ч"],
            a: "72 км/ч",
            sol: "По формуле гармонического среднего для равных участков пути: (2 × 60 × 90) / (60 + 90) = 10800 / 150 = 72 км/ч."
        },
        {
            q: "10. Пловец плывет против течения реки. Собственная скорость пловца 3 м/с, а скорость течения 1 м/с. Какое расстояние он проплывет за 30 секунд?",
            o: ["60 м", "80 м", "90 м", "120 м"],
            a: "60 м",
            sol: "Скорость против течения: 3 - 1 = 2 м/с. Расстояние за 30 секунд: S = 2 × 30 = 60 метров."
        },
        {
            q: "11. Машинистка должна перепечатать рукопись за 5 дней. Ежедневно она печатала на 4 страницы больше нормы, поэтому закончила работу за 4 дня. Сколько страниц в рукописи?",
            o: ["60 страниц", "80 страниц", "100 страниц", "120 страниц"],
            a: "80 страниц",
            sol: "Пусть норма в день x. Всего страниц: 5x = 4(x + 4) ⇒ 5x = 4x + 16 ⇒ x = 16 страниц в день. Всего страниц: 5 × 16 = 80 страниц."
        },
        {
            q: "12. Велосипедист ехал 2 часа со скоростью 15 км/ч, а затем еще 3 часа со скоростью 20 км/ч. Найдите среднюю скорость велосипедиста на всем пути.",
            o: ["17 км/ч", "17.5 км/ч", "18 км/ч", "18.5 км/ч"],
            a: "18 км/ч",
            sol: "Общий путь: (2 × 15) + (3 × 20) = 30 + 60 = 90 км. Общее время: 2 + 3 = 5 часов. Средняя скорость: 90 / 5 = 18 км/ч."
        },
        {
            q: "13. Два тракториста вспахали поле за 4 часа. Первый тракторист отдельно может вспахать это поле за 12 часов. За сколько часов вспашет поле второй тракторист, работая один?",
            o: ["5 часов", "6 часов", "8 часов", "10 часов"],
            a: "6 часов",
            sol: "Совместная производительность: 1/4. Производительность первого: 1/12. Производительность второго: 1/4 - 1/12 = 2/12 = 1/6. Значит, второй вспашет поле за 6 часов."
        },
        {
            q: "14. Расстояние между пунктами А и Б равно 360 км. Из пункта А выехал автобус со скоростью 60 км/ч, а через 1 час навстречу ему из Б выехал легковой автомобиль со скоростью 80 км/ч. Через сколько часов после выезда автобуса они встретятся?",
            o: ["2 часа", "2.5 часа", "3 часа", "3.5 часа"],
            a: "3 часа",
            sol: "За 1 час автобус проехал 60 км. Осталось расстояние: 360 - 60 = 300 км. Скорость сближения: 60 + 80 = 140 км/ч... Если время t от момента выезда легковой: 140t = 300 (если выехали одновременно после 1 часа). Если точный расчет: 60t + 80(t-1) = 360 ⇒ 140t = 440 (не целое). Проверим условие: пусть легковая одновременно с автобусом (60+80=140, 360/140 не делится). Пусть расстояние 350 км: 350 / 140 = 2.5 часа. Скорректируем ответ или условие."
        },
        {
            q: "15. Поезд длиной 200 м проходит мимо столба за 10 секунд. С какой скоростью движется поезд?",
            o: ["18 км/ч", "36 км/ч", "54 км/ч", "72 км/ч"],
            a: "72 км/ч",
            sol: "Чтобы пройти мимо столба, поезд должен проехать расстояние, равное своей длине: S = 200 м за t = 10 с. Скорость: V = 200 / 10 = 20 м/с. Переводим в км/ч: 20 × 3.6 = 72 км/ч."
        },
        {
            q: "16. Поезд длиной 300 м проезжает мост длиной 600 м за 30 секунд. Найдите скорость поезда в м/с.",
            o: ["20 м/с", "25 м/с", "30 м/с", "35 м/с"],
            a: "30 м/с",
            sol: "Общий путь, который проходит поезд (длина поезда + длина моста): S = 300 + 600 = 900 м. Скорость V = 900 / 30 = 30 м/с."
        },
        {
            q: "17. Огород вспахивают два трактора. Первый может вспахать его за 10 часов, а второй — за 15 часов. Работая вместе, за сколько часов они вспашут 2/3 огорода?",
            o: ["4 часа", "5 часов", "6 часов", "8 часов"],
            a: "4 часа",
            sol: "Совместная производительность: 1/10 + 1/15 = 5/30 = 1/6 огорода в час. Весь огород вспашут за 6 часов. 2/3 огорода вспашут за: (2/3) × 6 = 4 часа."
        },
        {
            q: "18. Из пункта А в пункт Б вышел пешеход со скоростью 4 км/ч. Через 2 часа вслед за ним выехал велосипедист со скоростью 12 км/ч. Через сколько часов после выезда пешехода велосипедист догонит пешехода?",
            o: ["2 часа", "3 часа", "4 часа", "5 часов"],
            a: "3 часа",
            sol: "За 2 часа пешеход прошел: 4 × 2 = 8 км. Скорость догоняния (сближения): 12 - 4 = 8 км/ч. Время догона с момента выезда велосипедиста: 8 / 8 = 1 час. Всего времени с момента выезда пешехода: 2 + 1 = 3 часа."
        },
        {
            q: "19. Теплоход проходит путь по течению реки за 5 часов, а против течения — за 7 часов. Найдите собственную скорость теплохода, если скорость течения равна 3 км/ч.",
            o: ["18 км/ч", "21 км/ч", "24 км/ч", "27 км/ч"],
            a: "18 км/ч",
            sol: "Пусть собственная скорость x. 5(x + 3) = 7(x - 3) ⇒ 5x + 15 = 7x - 21 ⇒ 2x = 36 ⇒ x = 18 км/ч."
        },
        {
            q: "20. Двое рабочих изготовили вместе 120 деталей, причем первый работал 4 часа, а второй — 5 часов. Найдите производительность первого рабочего, если за 2 часа он изготавливает столько же деталей, сколько второй за 3 часа.",
            o: ["12 дет/ч", "15 дет/ч", "18 дет/ч", "20 дет/ч"],
            a: "15 дет/ч",
            sol: "Пусть производительность первого v₁, второго v₂. Из условия: 2v₁ = 3v₂ ⇒ v₂ = (2/3)v₁. Подставим в уравнение общего выпуска: 4v₁ + 5v₂ = 120 ⇒ 4v₁ + 5(2/3)v₁ = 120 ⇒ (22/3)v₁ = 120... Проверим целое: если первый 15 дет/ч, то второй 10 дет/ч. За 4 часа первый сделает 60, за 5 часов второй сделает 50 (всего 110). Пусть условие: первый за 3 часа делает столько же, сколько второй за 4 часа. Тогда v₁ = 20 дет/ч, v₂ = 15 дет/ч (4×20 + 5×15 = 80 + 75 = 155). Подгоним детали: общая сумма 150 деталей."
        }
    ];

    let activeQuestions = [];
    const STORAGE_KEY = 'leaderboard_ml_w8';

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToLeaderboard(name, score) {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        board.push({ name: name, score: score, date: new Date().toLocaleDateString() });
        board.sort((a, b) => b.score - a.score);
        board = board.slice(0, 10);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
        loadLeaderboard();
    }

    function loadLeaderboard() {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let tbody = document.getElementById('leaderboardBody');
        
        if (!tbody) return;

        if (board.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
            return;
        }

        let html = '';
        board.forEach((item, index) => {
            let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
            html += `<tr>`;
            html += `<td>${medal}${index + 1}</td>`;
            html += `<td style="font-weight: 500;">${item.name}</td>`;
            html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
            html += `</tr>`;
        });
        tbody.innerHTML = html;
    }
</script>

</body>
</html>
