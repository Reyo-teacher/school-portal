<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математика — Портал Логунова Г.В.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Только для списка тем */
.intro{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.intro .owl{font-size:44px}
.topics{display:grid;gap:14px;margin-top:14px}
.topic{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;padding:16px 20px;border-radius:20px;
  background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.2);transition:.15s;-webkit-tap-highlight-color:transparent}
.topic:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(0,0,0,.2)}
.topic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.t-num{flex:none;min-width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.28);font-size:19px;font-weight:800}
.t-title{font-size:18px;font-weight:800;line-height:1.3}
.t-sub{font-size:14px;font-weight:700;opacity:.95}
.c1{--c1:#0284c7;--c2:#1d4ed8}.c2{--c1:#16a34a;--c2:#15803d}.c3{--c1:#ea580c;--c2:#c2410c}
.c4{--c1:#9333ea;--c2:#7e22ce}.c5{--c1:#db2777;--c2:#be185d}
</style>
</head>
<body>
<div class="wrapper">
  <header><h1 class="teacher-name">Логунов Григорий Владимирович — Математика</h1></header>

  <div class="card">
    <a href="index.html" class="back-btn">← На главную</a>
    <h2>📐 Математика</h2>
    <div class="intro"><span class="owl">🦉</span><div class="bubble">Выбирай тему: в каждой есть лекция и тренажёр с новыми заданиями!</div></div>

    <div class="topics">
      <a class="topic c1" href="tema-1-1.html">
        <span class="t-num">1.1</span>
        <span><span class="t-title">Натуральные числа и нуль</span></span>
      </a>
      <a class="topic c2" href="tema-1-2.html">
        <span class="t-num">1.2</span>
        <span><span class="t-title">Координатный луч. Изображение натуральных чисел и числа нуль на координатном луче</span></span>
      </a>

      <!-- Чтобы добавить тему: скопируйте блок <a class="topic ..."> целиком, поменяйте
           номер, название и ссылку href. Цвета по кругу: c1, c2, c3, c4, c5. -->
    </div>
  </div>
</div>
</body>
</html>
