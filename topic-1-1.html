<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.1. Натуральные числа и нуль — Портал Логунова Г.В.</title>
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.25);
            --success: #34d399;
            --error: #f87171;
            --level-a: #38bdf8;
            --level-b: #fbbf24;
            --level-c: #f43f5e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.6;
        }

        .wrapper { max-width: 950px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 22px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        h3 { font-size: 18px; color: #7dd3fc; margin-top: 25px; display: flex; align-items: center; gap: 8px; }

        p, li { color: #cbd5e1; font-size: 15px; }

        .back-btn {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--accent); color: #0f172a; }

        /* ВИЗУАЛЬНЫЕ БЛОКИ ТЕОРИИ */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .info-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .info-card-title { font-weight: 700; color: var(--accent); margin-bottom: 8px; font-size: 16px; display: flex; align-items: center; gap: 6px; }

        /* ТАБЛИЦА РАЗРЯДОВ */
        .table-responsive { overflow-x: auto; margin: 20px 0; }
        .place-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .place-table th {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent);
            padding: 10px;
            border: 1px solid var(--border-color);
        }
        .place-table td {
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            color: #cbd5e1;
        }
        .digit-highlight {
            font-weight: 800;
            color: #38bdf8;
            font-size: 18px;
        }

        /* ФИЛЬТРЫ И ЗАДАНИЯ */
        .filter-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .task-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            transition: border-color 0.2s;
        }
        .task-box:hover { border-color: rgba(56, 189, 248, 0.5); }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .task-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .badge-a { background: rgba(56, 189, 248, 0.15); color: var(--level-a); border: 1px solid var(--level-a); }
        .badge-b { background: rgba(251, 191, 36, 0.15); color: var(--level-b); border: 1px solid var(--level-b); }
        .badge-c { background: rgba(244, 63, 94, 0.15); color: var(--level-c); border: 1px solid var(--level-c); }

        .task-condition {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            gap: 8px;
        }
        .task-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .task-input {
            background: #0f172a;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            width: 230px;
            outline: none;
            transition: all 0.2s;
        }
        .task-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .check-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .check-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        
        .feedback {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Логунов Григорий Владимирович — Математика</h1>
