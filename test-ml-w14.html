<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 14: Сравнение величин и логика — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 14</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Сравнение величин и математическая логика</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Лучшие результаты недели 14:</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Динамически заполняется -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const questionPool = [
        {
            q: "1. Сравните величины: Графа А = 25% от 80, Графа Б = 20% от 100.",
            svg: `<svg width="180" height="50" viewBox="0 0 180 50"><rect x="10" y="10" width="160" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="90" y="30" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">А: 25% от 80 | Б: 20% от 100</text></svg>`,
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Значения равны",
            sol: "Графа А: 0.25 × 80 = 20. Графа Б: 0.20 × 100 = 20. Сравниваемые величины равны."
        },
        {
            q: "2. Сравните величины для x > 0: Графа А = x² + 1, Графа Б = (x + 1)².",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа Б больше",
            sol: "Раскроем скобки в Графе Б: (x + 1)² = x² + 2x + 1. Сравниваем x² + 1 и x² + 2x + 1. Так как x > 0, слагаемое 2x > 0, поэтому Графа Б всегда больше."
        },
        {
            q: "3. Известно, что 'Все отличники класса сдали экзамен по математике'. Какое из следующих утверждений НЕПОСРЕДСТВЕННО вытекает из этого факта?",
            o: ["Если ученик не отличник, то он не сдал экзамен", "Если ученик сдал экзамен, то он отличник", "Если ученик не сдал экзамен, то он не отличник", "Все сдавшие экзамен — отличники"],
            a: "Если ученик не сдал экзамен, то он не отличник",
            sol: "По правилам формальной логики высказывание 'A ⇒ B' эквивалентно высказыванию 'не B ⇒ не A' (закон контрапозиции). Если не B (не сдал), то не A (не отличник)."
        },
        {
            q: "4. Сравните величины: Графа А = 2³⁰, Графа Б = 3²⁰.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа Б больше",
            sol: "Преобразуем к одинаковому показателю степени 10: 2³⁰ = (2³)¹⁰ = 8¹⁰. 3²⁰ = (3²)¹⁰ = 9¹⁰. Так как 9 > 8, то 9¹⁰ > 8¹⁰, следовательно, Графа Б больше."
        },
        {
            q: "5. Отметьте отрицание логического утверждения: 'Каждый ученик школы занимается спортом'.",
            o: ["Ни один ученик школы не занимается спортом", "Существует ученик школы, который не занимается спортом", "Все ученики школы не занимаются спортом", "Некоторые ученики занимаются спортом"],
            a: "Существует ученик школы, который не занимается спортом",
            sol: "Отрицанием квантора общности ('Все/Каждый P') является квантор существования с отрицанием свойства ('Существует не P')."
        },
        {
            q: "6. Сравните величины: Графа А = Площадь квадрата с периметром 20 см, Графа Б = Площадь прямоугольника с периметром 20 см (длина ≠ ширина).",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа А больше",
            sol: "При одинаковом периметре из всех прямоугольников квадрат имеет наибольшую площадь. Площадь квадрата = 5² = 25 см², у любого прямоугольника с P=20 площадь будет строго меньше 25 см²."
        },
        {
            q: "7. Известно, что верны два утверждения: 'Все кошки любят рыбу' и 'Пушок — кошка'. Какой логический вывод верен?",
            o: ["Пушок не любит рыбу", "Пушок любит рыбу", "Все, кто любит рыбу — кошки", "Рыба любит Пушка"],
            a: "Пушок любит рыбу",
            sol: "Классический силлогизм: если элемент принадлежит множеству (Пушок ∈ Кошки), а все элементы множества обладают свойством (Кошки ⇒ Любят рыбу), то элемент обладает этим свойством."
        },
        {
            q: "8. Сравните величины при a < 0: Графа А = a³, Графа Б = a².",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа Б больше",
            sol: "Для любого отрицательного числа a < 0 его куб a³ отрицателен (a³ < 0), а его квадрат a² положителен (a² > 0). Любое положительное число больше отрицательного, значит Графа Б больше."
        },
        {
            q: "9. Какое из высказываний является ЛОЖНЫМ?",
            o: ["Число 2 — четное простое число", "Сумма двух нечетных чисел всегда четна", "Любое число, делящееся на 9, делится на 3", "Произведение двух простых чисел всегда простое"],
            a: "Произведение двух простых чисел всегда простое",
            sol: "Произведение двух простых чисел (например, 2 × 3 = 6) является составным числом, так как имеет как минимум 4 делителя (1, 2, 3, 6)."
        },
        {
            q: "10. Сравните величины: Графа А = 1/3 + 1/4, Графа Б = 1/2.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа А больше",
            sol: "Графа А: 1/3 + 1/4 = 4/12 + 3/12 = 7/12. Графа Б: 1/2 = 6/12. Так как 7/12 > 6/12, Графа А больше."
        },
        {
            q: "11. В классе 30 человек. Из них 18 любят математику, 15 — физику, а 3 не любят ни один из этих предметов. Сколько человек любят И математику, И физику?",
            o: ["3", "6", "9", "12"],
            a: "6",
            sol: "По формуле включений-исключений (круги Эйлера): Учеников, любящих хотя бы один предмет = 30 - 3 = 27. Любят оба предмета = (18 + 15) - 27 = 33 - 27 = 6 человек."
        },
        {
            q: "12. Сравните величины: Графа А = Среднее арифметическое чисел 10, 20, 30. Графа Б = Медиана чисел 10, 20, 30.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Значения равны",
            sol: "Среднее арифметическое: (10 + 20 + 30) / 3 = 60 / 3 = 20. Медиана упорядоченного ряда (10, 20, 30) равна центральному элементу = 20. Значения равны."
        },
        {
            q: "13. Какое утверждение является эквивалентным высказыванию: 'Если идет дождь, то асфальт мокрый'?",
            o: ["Если асфальт мокрый, то идет дождь", "Если асфальт сухой, то дождь не идет", "Если дождь не идет, то асфальт сухой", "Дождь идет всегда"],
            a: "Если асфальт сухой, то дождь не идет",
            sol: "Закон контрапозиции в логике: отрицание следствия влечет отрицание условия (не B ⇒ не A)."
        },
        {
            q: "14. Сравните величины: Графа А = (-1)¹⁰⁰, Графа Б = (-1)¹⁰¹.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа А больше",
            sol: "Графа А: (-1) в четной степени 100 равна +1. Графа Б: (-1) в нечетной степени 101 равна -1. Так как 1 > -1, Графа А больше."
        },
        {
            q: "15. Если истинно высказывание 'Некоторые студенты — спортсмены', то какое из следующих высказываний заведомо ИСТИННО?",
            o: ["Все студенты — спортсмены", "Ни один студент не является спортсменом", "Существует хотя бы один студент-спортсмен", "Все спортсмены — студенты"],
            a: "Существует хотя бы один студент-спортсмен",
            sol: "Высказывание 'Некоторые X есть Y' по определению означает 'Существует хотя бы один X, который является Y'."
        },
        {
            q: "16. Сравните величины: Графа А = Длина окружности радиуса 5 см, Графа Б = Периметр квадрата со стороной 8 см.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Графа Б больше",
            sol: "Графа А: C = 2 × 3.14 × 5 = 31.4 см. Графа Б: P = 4 × 8 = 32 см. Так как 32 > 31.4, Графа Б больше."
        },
        {
            q: "17. Даны утверждения: 1) Если число делится на 6, то оно делится на 2. 2) Число 24 делится на 6. Какой вывод следует из этих посылок?",
            o: ["Число 24 не делится на 2", "Число 24 делится на 2", "Число 24 делится на 12", "Вывод сделать нельзя"],
            a: "Число 24 делится на 2",
            sol: "По правилу Modus Ponens (утвеждение условия логической импликации): если A ⇒ B и известно A, то верно B."
        },
        {
            q: "18. Сравните величины для x < 0: Графа А = |x|, Графа Б = -x.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Значения равны",
            sol: "По определению модуля для отрицательного числа x < 0 значение |x| = -x. Поэтому обе величины равны."
        },
        {
            q: "19. Отрицанием высказывания 'Сумма углов треугольника равна 180° или 200°' является:",
            o: ["Сумма углов треугольника не равна 180° и не равна 200°", "Сумма углов треугольника не равна 180° или не равна 200°", "Сумма углов равна 180°", "Сумма углов равна 360°"],
            a: "Сумма углов треугольника не равна 180° и не равна 200°",
            sol: "По закону де Моргана отрицание дизъюнкции not (A или B) превращается в конъюнкцию отрицаний (not A и not B)."
        },
        {
            q: "20. Сравните величины: Графа А = 0,5%, Графа Б = 0,005.",
            o: ["Графа А больше", "Графа Б больше", "Значения равны", "Нельзя определить"],
            a: "Значения равны",
            sol: "Переведем проценты в десятичную дробь: 0,5% = 0,5 / 100 = 0,005. Графа А и Графа Б равны."
        }
    ];

    let activeQuestions = [];
    const STORAGE_KEY = 'leaderboard_ml_w14';

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToLeaderboard(name, score) {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        board.push({ name: name, score: score, date: new Date().toLocaleDateString() });
        board.sort((a, b) => b.score - a.score);
        board = board.slice(0, 10);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
        loadLeaderboard();
    }

    function loadLeaderboard() {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let tbody = document.getElementById('leaderboardBody');
        
        if (!tbody) return;

        if (board.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
            return;
        }

        let html = '';
        board.forEach((item, index) => {
            let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
            html += `<tr>`;
            html += `<td>${medal}${index + 1}</td>`;
            html += `<td style="font-weight: 500;">${item.name}</td>`;
            html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
            html += `</tr>`;
        });
        tbody.innerHTML = html;
    }
</script>

</body>
</html>
