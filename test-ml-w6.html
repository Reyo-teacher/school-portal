<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 6: Комбинаторика — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 6</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Комбинаторика и правило умножения</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Лучшие результаты недели 6:</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Динамически заполняется -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const questionPool = [
        {
            q: "1. В меню столовой есть 4 вида первых блюд, 5 видов вторых блюд и 3 вида напитков. Сколькими способами можно выбрать обед, состоящий из одного первого, одного второго и одного напитка?",
            svg: `<svg width="160" height="60" viewBox="0 0 160 60"><rect x="10" y="15" width="140" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="80" y="35" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">4 × 5 × 3 = ?</text></svg>`,
            o: ["12", "20", "60", "120"],
            a: "60",
            sol: "По правилу умножения в комбинаторике: общее количество комбинаций равно 4 × 5 × 3 = 60 вариантов."
        },
        {
            q: "2. Сколькими способами 5 человек могут встать в очередь в кассу?",
            o: ["25", "60", "120", "240"],
            a: "120",
            sol: "Количество перестановок из 5 элементов равна P₅ = 5! = 1 × 2 × 3 × 4 × 5 = 120 способов."
        },
        {
            q: "3. Сколько трехзначных чисел можно составить из цифр 1, 2, 3, 4, 5, если цифры в числе не повторяются?",
            o: ["15", "60", "125", "243"],
            a: "60",
            sol: "Число размещений без повторений: A₅³ = 5 × 4 × 3 = 60 трехзначных чисел."
        },
        {
            q: "4. В классе 20 учеников. Сколькими способами можно выбрать старосту и его заместителя?",
            o: ["190", "380", "400", "200"],
            a: "380",
            sol: "Старостой можно выбрать любого из 20 учеников, а заместителем — любого из оставшихся 19. Всего: 20 × 19 = 380 способов."
        },
        {
            q: "5. Сколькими способами можно выбрать 2 дежурных из 10 учеников класса?",
            o: ["45", "90", "20", "100"],
            a: "45",
            sol: "Так как порядок выбора дежурных не важен, используем число сочетаний C₁₀² = (10 × 9) / 2 = 45 способов."
        },
        {
            q: "6. При встрече 6 друзей пожали друг другу руки. Сколько всего рукопожатий было сделано?",
            o: ["12", "15", "30", "36"],
            a: "15",
            sol: "Каждое рукопожатие соединяет 2 человек. Число рукопожатий = C₆² = (6 × 5) / 2 = 15."
        },
        {
            q: "7. Сколько четырехзначных четных чисел можно составить из цифр 0, 1, 2, 3, если цифры НЕ повторяются?",
            o: ["10", "12", "18", "24"],
            a: "10",
            sol: "Четное число оканчивается на 0 или 2. Случай 1 (на конце 0): 3 × 2 × 1 × 1 = 6 чисел. Случай 2 (на конце 2, первой не может быть 0): 2 × 2 × 1 × 1 = 4 числа. Всего: 6 + 4 = 10 чисел."
        },
        {
            q: "8. В расписании на понедельник 5 уроков: математика, физика, химия, история, литература. Сколькими способами можно составить расписание на этот день?",
            o: ["25", "60", "120", "720"],
            a: "120",
            sol: "Число перестановок из 5 предметов: P₅ = 5! = 120 способов."
        },
        {
            q: "9. На окружности отмечено 8 точек. Сколько различных хорд можно провести с концами в этих точках?",
            o: ["16", "28", "56", "64"],
            a: "28",
            sol: "Каждая хорда определяется парой точек. Порядок точек не важен. C₈² = (8 × 7) / 2 = 28 хорд."
        },
        {
            q: "10. Сколько различных двузначных чисел можно составить из цифр 2, 4, 6, 8, если цифры МОГУТ повторяться?",
            o: ["8", "12", "16", "24"],
            a: "16",
            sol: "На первое место можно поставить одну из 4 цифр, на второе место — также одну из 4 цифр. Всего: 4 × 4 = 16 чисел."
        },
        {
            q: "11. В танцевальном кружке 6 мальчиков и 8 девочек. Сколькими способами можно составить одну пару (мальчик и девочка)?",
            o: ["14", "24", "48", "56"],
            a: "48",
            sol: "По правилу умножения: любого из 6 мальчиков можно соединить в пару с любой из 8 девочек. 6 × 8 = 48 пар."
        },
        {
            q: "12. Сколько анаграмм (перестановок букв) можно составить из слова 'КНИГА'?",
            o: ["24", "60", "120", "720"],
            a: "120",
            sol: "В слове 'КНИГА' 5 различных букв. Количество перестановок равна 5! = 120."
        },
        {
            q: "13. В первенстве по футболу участвовало 10 команд. Каждая сыграла с каждой по одному матчу. Сколько всего матчей было сыграно?",
            o: ["45", "90", "100", "50"],
            a: "45",
            sol: "Число матчей равно C₁₀² = (10 × 9) / 2 = 45 игр."
        },
        {
            q: "14. Чему равно значение выражения 6! / 4! ?",
            o: ["2", "12", "30", "24"],
            a: "30",
            sol: "6! / 4! = (1 × 2 × 3 × 4 × 5 × 6) / (1 × 2 × 3 × 4) = 5 × 6 = 30."
        },
        {
            q: "15. Сколькими способами можно расставить 4 книги на книжной полке?",
            o: ["12", "16", "24", "48"],
            a: "24",
            sol: "Перестановки из 4 элементов: P₄ = 4! = 1 × 2 × 3 × 4 = 24 способа."
        },
        {
            q: "16. Из вазы, в которой лежат 5 яблок и 4 груши, нужно выбрать один фрукт (или яблоко, или грушу). Сколькими способами это можно сделать?",
            o: ["9", "20", "1", "10"],
            a: "9",
            sol: "По правилу сложения в комбинаторике: 5 + 4 = 9 способов."
        },
        {
            q: "17. Сколько существует трехзначных чисел, все цифры которых нечетные (1, 3, 5, 7, 9) и могут повторяться?",
            o: ["60", "125", "243", "120"],
            a: "125",
            sol: "На каждой из трех позиций может стоять любая из 5 нечетных цифр. Всего: 5 × 5 × 5 = 125 чисел."
        },
        {
            q: "18. Из 7 членов шахматного кружка нужно выбрать команду из 3 человек для участия в соревнованиях. Сколькими способами это можно сделать?",
            o: ["21", "35", "70", "210"],
            a: "35",
            sol: "Порядок в команде не важен. Используем формулу сочетаний: C₇³ = (7 × 6 × 5) / (3 × 2 × 1) = 35 способов."
        },
        {
            q: "19. На вершину горы ведут 5 дорог. Сколькими способами турист может подняться на гору и спуститься с нее, если спуск и подъем происходят по РАЗНЫМ дорогам?",
            o: ["20", "25", "10", "15"],
            a: "20",
            sol: "Для подъема у туриста есть 5 дорог, а для спуска остается 4 дороги. По правилу умножения: 5 × 4 = 20 способов."
        },
        {
            q: "20. Сколько различных трехбуквенных кодов можно составить из букв А, Б, В, Г, если буквы в коде НЕ повторяются?",
            o: ["12", "24", "64", "16"],
            a: "24",
            sol: "Размещения без повторений из 4 элементов по 3: A₄³ = 4 × 3 × 2 = 24 кода."
        }
    ];

    let activeQuestions = [];
    const STORAGE_KEY = 'leaderboard_ml_w6';

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToLeaderboard(name, score) {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        board.push({ name: name, score: score, date: new Date().toLocaleDateString() });
        board.sort((a, b) => b.score - a.score);
        board = board.slice(0, 10);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
        loadLeaderboard();
    }

    function loadLeaderboard() {
        let board = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let tbody = document.getElementById('leaderboardBody');
        
        if (!tbody) return;

        if (board.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
            return;
        }

        let html = '';
        board.forEach((item, index) => {
            let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
            html += `<tr>`;
            html += `<td>${medal}${index + 1}</td>`;
            html += `<td style="font-weight: 500;">${item.name}</td>`;
            html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
            html += `</tr>`;
        });
        tbody.innerHTML = html;
    }
</script>

</body>
</html>
