<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 4: Практическая геометрия и измерения — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 4</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Практическая геометрия и измерения</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Общий рейтинг школы (Неделя 4):</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Загрузка рейтинга...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwk6LbGQb8yiUnozyt7uOshLK79-EB52HEYA6-PfkjvJILON8zR41JkdTgM0apg7OHJ/exec";
    const CURRENT_WEEK = "Неделя 4";

    const questionPool = [
        {
            q: "1. Найдите площадь прямоугольника, если его периметр равен 36 см, а длина в 2 раза больше ширины.",
            svg: `<svg width="160" height="60" viewBox="0 0 160 60"><rect x="20" y="15" width="120" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="80" y="34" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">P = 36 см</text></svg>`,
            o: ["48 см²", "54 см²", "72 см²", "96 см²"],
            a: "72 см²",
            sol: "Пусть ширина x, тогда длина 2x. Периметр P = 2(x + 2x) = 6x = 36, откуда x = 6 см (ширина), длина 12 см. Площадь: 6 × 12 = 72 см²."
        },
        {
            q: "2. Длина прямоугольного участка равна 15 м, а ширина на 4 м меньше. Найдите периметр участка.",
            o: ["38 м", "52 м", "30 м", "44 м"],
            a: "52 м",
            sol: "Ширина участка: 15 - 4 = 11 м. Периметр: P = 2 × (15 + 11) = 2 × 26 = 52 м."
        },
        {
            q: "3. Радиус круга равен 7 см. Найдите площадь этого круга (примите $\\pi \\approx 22/7$).",
            o: ["44 см²", "154 см²", "308 см²", "616 см²"],
            a: "154 см²",
            sol: "Площадь круга вычисляется по формуле $S = \\pi r^2$. Подставляем значения: $S = (22/7) \\times 7^2 = (22/7) \\times 49 = 154$ см²."
        },
        {
            q: "4. Найдите объем прямоугольного параллелепипеда, измерения которого равны 4 см, 5 см и 10 см.",
            o: ["90 см³", "120 см³", "200 см³", "250 см³"],
            a: "200 см³",
            sol: "Объем прямоугольного параллелепипеда равен произведению трех его измерений: V = 4 × 5 × 10 = 200 см³."
        },
        {
            q: "5. Периметр квадрата равен 36 см. Найдите его площадь.",
            o: ["36 см²", "64 см²", "81 см²", "100 см²"],
            a: "81 см²",
            sol: "Сторона квадрата равна 36 / 4 = 9 см. Площадь квадрата: 9 × 9 = 81 см²."
        },
        {
            q: "6. Во сколько раз увеличится площадь квадрата, если каждую его сторону увеличить в 3 раза?",
            o: ["В 3 раза", "В 6 раз", "В 9 раз", "В 12 раз"],
            a: "В 9 раз",
            sol: "Площадь квадрата пропорциональна квадрату его стороны: $(3a)^2 = 9a^2$. Площадь увеличится в 9 раз."
        },
        {
            q: "7. Найдите длину окружности, если ее диаметр равен 14 см (примите $\\pi \\approx 22/7$).",
            o: ["22 см", "44 см", "88 см", "154 см"],
            a: "44 см",
            sol: "Длина окружности вычисляется по формуле $C = \\pi d$. Подставляем: $C = (22/7) \\times 14 = 44$ см."
        },
        {
            q: "8. Площадь прямоугольника равна 72 см², а его ширина равна 6 см. Найдите периметр этого прямоугольника.",
            o: ["24 см", "36 см", "48 см", "60 см"],
            a: "36 см",
            sol: "Длина прямоугольника: 72 / 6 = 12 см. Периметр: P = 2 × (12 + 6) = 2 × 18 = 36 см."
        },
        {
            q: "9. Основание треугольника равно 10 см, а высота, проведенная к нему, равна 6 см. Найдите площадь треугольника.",
            o: ["30 см²", "60 см²", "15 см²", "45 см²"],
            a: "30 см²",
            sol: "Площадь треугольника равна половине произведения основания на высоту: $S = \\frac{1}{2} \\times 10 \\times 6 = 30$ см²."
        },
        {
            q: "10. Сколько квадратных сантиметров в 3 квадратных дециметрах?",
            o: ["30 см²", "300 см²", "3000 см²", "30 000 см²"],
            a: "300 см²",
            sol: "Так как 1 дм = 10 см, то 1 дм² = 100 см². Следовательно, 3 дм² = 3 × 100 = 300 см²."
        },
        {
            q: "11. Найдите объем куба, если площадь его полной поверхности равна 96 см².",
            o: ["64 см³", "125 см³", "216 см³", "512 см³"],
            a: "64 см³",
            sol: "У куба 6 одинаковых граней. Площадь одной грани: 96 / 6 = 16 см². Ребро куба равно $\\sqrt{16} = 4$ см. Объем куба: $V = 4^3 = 64$ см³."
        },
        {
            q: "12. Диагональ прямоугольника делит его на два треугольника. Найдите площадь каждого треугольника, если стороны прямоугольника равны 8 см и 12 см.",
            o: ["48 см²", "96 см²", "24 см²", "36 см²"],
            a: "48 см²",
            sol: "Площадь всего прямоугольника: 8 × 12 = 96 см². Диагональ делит его на два равных треугольника, поэтому площадь каждого: 96 / 2 = 48 см²."
        },
        {
            q: "13. Найдите площадь трапеции, у которой основания равны 7 см и 13 см, а высота равна 5 см.",
            o: ["50 см²", "65 см²", "100 см²", "35 см²"],
            a: "50 см²",
            sol: "Площадь трапеции равна произведению полусуммы оснований на высоту: $S = \\frac{7 + 13}{2} \\times 5 = 10 \\times 5 = 50$ см²."
        },
        {
            q: "14. Бассейн имеет форму прямоугольного параллелепипеда с длиной 10 м, шириной 5 м и глубиной 2 м. Сколько кубических метров воды вмещает бассейн?",
            o: ["70 м³", "100 м³", "120 м³", "150 м³"],
            a: "100 м³",
            sol: "Объем бассейна (его вместимость) равен произведению длины, ширины и глубины: V = 10 × 5 × 2 = 100 м³."
        },
        {
            q: "15. Во сколько раз увеличится объем куба, если каждое его ребро увеличить в 2 раза?",
            o: ["В 2 раза", "В 4 раза", "В 6 раз", "В 8 раз"],
            a: "В 8 раз",
            sol: "Объем куба пропорционален кубу его ребра: $(2a)^3 = 8a^3$. Объем увеличится в 8 раз."
        },
        {
            q: "16. Сумма длин всех ребер куба равна 72 см. Найдите объем этого куба.",
            o: ["216 см³", "343 см³", "512 см³", "729 см³"],
            a: "216 см³",
            sol: "У куба 12 ребер. Длина одного ребра: 72 / 12 = 6 см. Объем куба: $V = 6^3 = 216$ см³."
        },
        {
            q: "17. Радиус круга увеличили в 2 раза. Как изменилась площадь круга?",
            o: ["Увеличилась в 2 раза", "Увеличилась в 4 раза", "Увеличилась в 8 раза", "Не изменилась"],
            a: "Увеличилась в 4 раза",
            sol: "Площадь круга $S = \\pi r^2$. При увеличении радиуса в 2 раза площадь увеличивается пропорционально квадрату радиуса: $2^2 = 4$ раза."
        },
        {
            q: "18. Найдите площадь ромба, если его диагонали равны 10 см и 14 см.",
            o: ["140 см²", "70 см²", "35 см²", "24 см²"],
            a: "70 см²",
            sol: "Площадь ромба равна половине произведения его диагоналей: $S = \\frac{1}{2} \\times d_1 \\times d_2 = \\frac{1}{2} \\times 10 \\times 14 = 70$ см²."
        },
        {
            q: "19. Из листа железа в форме квадрата со стороной 10 см вырезали круг наибольшего возможного радиуса. Найдите площадь оставшейся части (примите $\\pi \\approx 3.14$).",
            o: ["21.5 см²", "78.5 см²", "85 см²", "25 см²"],
            a: "21.5 см²",
            sol: "Площадь квадрата: 10 × 10 = 100 см². Диаметр вырезанного круга равен 10 см, значит радиус r = 5 см. Площадь круга: $3.14 \\times 5^2 = 3.14 \\times 25 = 78.5$ см². Площадь остатка: 100 - 78.5 = 21.5 см²."
        },
        {
            q: "20. Комната имеет форму прямоугольника с размерами 4 м и 5 м. Сколько потребуется квадратных плиток со стороной 20 см, чтобы выложить пол в этой комнате?",
            o: ["100 плиток", "250 плиток", "500 плиток", "1000 плиток"],
            a: "500 плиток",
            sol: "Площадь комнаты: 4 м × 5 м = 20 м². Переведем в см²: 20 м² = 200 000 см². Площадь одной плитки: 20 см × 20 см = 400 см². Количество плиток: 200 000 / 400 = 500 штук."
        }
    ];

    let activeQuestions = [];

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToCloudLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToCloudLeaderboard(name, score) {
        let payload = {
            name: name,
            score: score,
            date: new Date().toLocaleDateString(),
            week: CURRENT_WEEK
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            console.log("Успешно сохранено:", data);
            loadLeaderboard();
        })
        .catch(err => {
            console.error("Ошибка сохранения:", err);
            setTimeout(loadLeaderboard, 1000);
        });
    }

    function loadLeaderboard() {
        let tbody = document.getElementById('leaderboardBody');
        if (!tbody) return;

        fetch(`${WEB_APP_URL}?week=${encodeURIComponent(CURRENT_WEEK)}`)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
                    return;
                }

                let html = '';
                data.slice(0, 10).forEach((item, index) => {
                    let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
                    html += `<tr>`;
                    html += `<td>${medal}${index + 1}</td>`;
                    html += `<td style="font-weight: 500;">${item.name}</td>`;
                    html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
                    html += `</tr>`;
                });
                tbody.innerHTML = html;
            })
            .catch(err => {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Не удалось загрузить рейтинг</td></tr>`;
            });
    }
</script>

</body>
</html>
