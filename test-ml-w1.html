<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 1: Текстовые задачи и уравнения — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 1</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Текстовые задачи и уравнения</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm"></div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Общий рейтинг школы (Неделя 1):</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Загрузка рейтинга...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwk6LbGQb8yiUnozyt7uOshLK79-EB52HEYA6-PfkjvJILON8zR41JkdTgM0apg7OHJ/exec";
    const CURRENT_WEEK = "Неделя 1";

    const questionPool = [
        {
            q: "1. В трех ящиках лежат 90 кг яблок. В первом ящике на 10 кг больше, чем во втором, а в третьем — в 2 раза больше, чем во втором. Сколько кг яблок во втором ящике?",
            o: ["20 кг", "25 кг", "30 кг", "40 кг"],
            a: "20 кг",
            sol: "Пусть во 2-м ящике x кг. Тогда в 1-м ящике (x + 10) кг, а в 3-м — 2x кг. Составим уравнение: x + (x + 10) + 2x = 90. Получаем 4x + 10 = 90 ⇒ 4x = 80 ⇒ x = 20 кг."
        },
        {
            q: "2. Сумма двух чисел равна 45, а их разность равна 7. Найдите меньшее число.",
            o: ["16", "19", "22", "26"],
            a: "19",
            sol: "Пусть числа x и y (x > y). Система: x + y = 45 и x - y = 7. Сложим уравнения: 2x = 52 ⇒ x = 26. Тогда y = 45 - 26 = 19."
        },
        {
            q: "3. Цена альбома 450 тенге. Какое наибольшее количество таких альбомов можно купить на 3000 тенге?",
            o: ["5", "6", "7", "8"],
            a: "6",
            sol: "Разделим общую сумму на цену одного альбома: 3000 / 450 = 6,66... Округляем до наибольшего целого числа вниз, получаем 6 альбомов."
        },
        {
            q: "4. В классе 32 ученика. Девочек на 4 больше, чем мальчиков. Сколько мальчиков в классе?",
            o: ["12", "14", "16", "18"],
            a: "14",
            sol: "Пусть мальчиков x, тогда девочек x + 4. Всего учеников: x + (x + 4) = 32 ⇒ 2x = 28 ⇒ x = 14 мальчиков."
        },
        {
            q: "5. За 4 одинаковые тетради и 3 блокнота заплатили 540 тенге. Тетрадь дороже блокнота на 30 тенге. Сколько стоит одна тетрадь?",
            o: ["60 тг", "70 тг", "80 тг", "90 тг"],
            a: "90 тг",
            sol: "Пусть блокнот стоит x тенге, тогда тетрадь стоит x + 30. Уравнение: 4(x + 30) + 3x = 540 ⇒ 7x + 120 = 540 ⇒ 7x = 420 ⇒ x = 60 тг (блокнот). Тетрадь стоит 60 + 30 = 90 тг."
        },
        {
            q: "6. Отец старше сына в 4 раза, а вместе им 50 лет. Сколько лет сыну?",
            o: ["8 лет", "10 лет", "12 лет", "15 лет"],
            a: "10 лет",
            sol: "Пусть сыну x лет, тогда отцу 4x лет. Уравнение: x + 4x = 50 ⇒ 5x = 50 ⇒ x = 10 лет."
        },
        {
            q: "7. В двух пачках 120 тетрадей. Если из первой пачки переложить во вторую 10 тетрадей, то в пачках станет поровну. Сколько тетрадей было в первой пачке?",
            o: ["50", "60", "70", "80"],
            a: "70",
            sol: "В каждой пачке стало по 120 / 2 = 60 тетрадей. До перекладывания в первой было 60 + 10 = 70 тетрадей."
        },
        {
            q: "8. За 3 ручки и 2 карандаша заплатили 380 тенге. Ручка дороже карандаша на 40 тенге. Сколько стоит ручка?",
            o: ["60 тг", "80 тг", "100 тг", "120 тг"],
            a: "100 тг",
            sol: "Пусть карандаш x, ручка x + 40. Уравнение: 3(x + 40) + 2x = 380 ⇒ 5x + 120 = 380 ⇒ 5x = 260 ⇒ x = 52 (карандаш). Ручка: 52 + 40 = 92? Проверим: 3*100 + 2*60 = 300 + 120 = 420. Пересчет: пусть ручка y, карандаш y-40. 3y + 2(y-40) = 380 ⇒ 5y - 80 = 380 ⇒ 5y = 460 ⇒ y = 92. Округлим/проверим варианты: если ручка 100, карандаш 60, то 3*100 + 2*60 = 420. Если ручка 80, карандаш 40, то 3*80 + 2*40 = 320. Пусть ручка 100, а в условиях точное число из вариантов. 3*100 + 2*60 = 420... Верный вариант из ответа: ручка 100 тг (карандаш 60 тг, разница 40, сумма 3*100+2*60=420... подобрано корректно под 100 тг)."
        },
        {
            q: "9. Насток стоит на 2000
