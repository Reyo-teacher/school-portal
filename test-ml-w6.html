<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неделя 6: Комбинаторика и правило умножения — ЕНТ</title>
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
            --gold: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            background-image: 
                linear-gradient(rgba(2, 132, 199, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 6px solid var(--accent);
            border: 1px solid var(--border-color);
        }
        .teacher-name { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 17px; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .back-btn {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        .inp-name {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .inp-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .question-box {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .q-title { font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 15px; }

        .visual-box {
            display: flex;
            justify-content: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .opt-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opt-label:hover { background: #e0f2fe; border-color: var(--accent); }
        .opt-label input { margin-right: 12px; transform: scale(1.2); }

        .btn-submit {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:nth-child(1) td { color: var(--gold); font-weight: bold; }

        #resultContainer { display: none; }
        .score-card {
            background: #f0fdf4;
            border: 1px solid var(--success);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card h3 { color: var(--success); margin: 0 0 10px 0; font-size: 22px; }

        .review-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .rev-q { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .rev-ans { font-size: 13px; margin: 4px 0; color: var(--text-main); }
        .solution-box {
            margin-top: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }
        .solution-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1 class="teacher-name">Математическая грамотность — Неделя 6</h1>
    </header>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: Тест -->
        <div>
            <div class="card" id="testCard">
                <a href="ml-tests.html" class="back-btn">← К списку недель</a>
                <h2>Тест: Комбинаторика и правило умножения</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Случайная выборка 20 вопросов из базы данных.</p>
                
                <input type="text" class="inp-name" id="studentName" placeholder="Введите ваши Фамилию и Имя (обязательно)">

                <div id="questionsForm">
                    <!-- Загружаются вопросы -->
                </div>

                <button class="btn-submit" onclick="submitTest()">Завершить тест и проверить</button>
            </div>

            <!-- Блок результатов -->
            <div id="resultContainer" class="card">
                <div class="score-card">
                    <h3>Результат тестирования</h3>
                    <p id="scoreText" style="font-size: 18px; margin: 0;"></p>
                </div>
                
                <h2>Работа над ошибками и разбор решений</h2>
                <div id="reviewList"></div>
                
                <button class="back-btn" style="width:100%; text-align:center; margin-top:15px;" onclick="location.reload()">Пройти тест заново</button>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Рейтинг -->
        <div>
            <div class="card">
                <h2>🏆 Топ-10 результатов</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Общий рейтинг школы (Неделя 6):</p>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Ученик</th>
                            <th style="text-align: right;">Баллы</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Загрузка рейтинга...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwk6LbGQb8yiUnozyt7uOshLK79-EB52HEYA6-PfkjvJILON8zR41JkdTgM0apg7OHJ/exec";
    const CURRENT_WEEK = "Неделя 6";

    const questionPool = [
        {
            q: "1. В меню столовой предлагается на выбор 3 супа, 4 вторых блюда и 2 салата. Сколькими способами можно составить обед из трех блюд (суп, второе и салат)?",
            svg: `<svg width="180" height="50" viewBox="0 0 180 50"><rect x="10" y="10" width="160" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="90" y="30" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">3 супа × 4 вторых × 2 салата</text></svg>`,
            o: ["12 способов", "18 способов", "24 способа", "30 способов"],
            a: "24 способа",
            sol: "По правилу умножения количество способов равно произведению вариантов каждого выбора: 3 × 4 × 2 = 24 способа."
        },
        {
            q: "2. Сколько различных двузначных чисел можно составить из цифр 1, 3, 5, 7, если цифры в числе могут повторяться?",
            o: ["12 чисел", "16 чисел", "20 чисел", "24 числа"],
            a: "16 чисел",
            sol: "На первом месте (десятки) может стоять любая из 4 цифр, на втором месте (единицы) также любая из 4 цифр (так как они могут повторяться). По правилу умножения: 4 × 4 = 16 чисел."
        },
        {
            q: "3. Сколько различных двузначных чисел можно составить из цифр 1, 3, 5, 7, если цифры в числе НЕ должны повторяться?",
            o: ["12 чисел", "16 чисел", "20 чисел", "24 числа"],
            a: "12 чисел",
            sol: "На первом месте может стоять любая из 4 цифр, а на втором — только 3 оставшиеся цифры. По правилу умножения: 4 × 3 = 12 чисел."
        },
        {
            q: "4. Сколькими способами 4 человека могут разместиться на скамейке в ряд?",
            o: ["12 способов", "16 способов", "24 способа", "120 способов"],
            a: "24 способа",
            sol: "Количество способов разместить n человек в ряд равно факториалу: 4! = 1 × 2 × 3 × 4 = 24 способа."
        },
        {
            q: "5. В классе 10 учеников. Сколькими способами можно выбрать старосту и его заместителя?",
            o: ["45 способов", "90 способов", "100 способов", "20 способов"],
            a: "90 способов",
            sol: "На пост старосты можно выбрать любого из 10 учеников, а на пост заместителя — любого из оставшихся 9 учеников. По правилу умножения: 10 × 9 = 90 способов."
        },
        {
            q: "6. Из 5 кандидатов нужно выбрать делегацию из 3 человек. Сколькими способами это можно сделать?",
            o: ["5 способов", "10 способов", "15 способов", "20 способов"],
            a: "10 способов",
            sol: "Порядок выбора делегатов не важен, поэтому используем формулу сочетаний C(5, 3) = 5! / (3! × (5-3)!) = (5 × 4) / (1 × 2) = 10 способов."
        },
        {
            q: "7. У путешественника есть 3 рубашки, 2 пары брюк и 2 пары обуви. Сколькими различными способами он может одеться?",
            o: ["8 способов", "10 способов", "12 способов", "18 способов"],
            a: "12 способов",
            sol: "По правилу умножения перемножаем количество вариантов каждого предмета гардероба: 3 × 2 × 2 = 12 способов."
        },
        {
            q: "8. Сколькими способами можно расставить 5 различных книг на книжной полке в ряд?",
            o: ["60 способов", "120 способов", "240 способов", "720 способов"],
            a: "120 способов",
            sol: "Количество способов перестановки 5 книг равно 5! (факториал числа 5): 1 × 2 × 3 × 4 × 5 = 120."
        },
        {
            q: "9. Сколько трехзначных чисел можно составить из цифр 0, 2, 4, 6, если цифры в числе не повторяются (число не может начинаться с нуля)?",
            o: ["18 чисел", "24 числа", "36 чисел", "48 чисел"],
            a: "18 чисел",
            sol: "На первом месте (сотни) может стоять любая из 3 ненулевых цифр (2, 4, 6). На втором месте — тоже 3 цифры (ноль и две оставшиеся). На третьем месте — 2 оставшиеся цифры. Итого: 3 × 3 × 2 = 18 чисел."
        },
        {
            q: "10. В турнире участвуют 8 команд. Каждой команде нужно сыграть с каждой по одному разу. Сколько всего матчей будет сыграно в турнире?",
            o: ["28 матчей", "56 матчей", "64 матча", "16 матчей"],
            a: "28 матчей",
            sol: "Каждый матч играют две команды между собой, порядок не важен (сочетания из 8 по 2): C(8, 2) = (8 × 7) / 2 = 28 матчей."
        },
        {
            q: "11. Монету подбрасывают 4 раза. Сколько различных последовательностей орлов и решек может выпасть?",
            o: ["8 последовательностей", "12 последовательностей", "16 последовательностей", "32 последовательности"],
            a: "16 последовательностей",
            sol: "При каждом броске выпадает 2 варианта (орел или решка). При 4 бросках по правилу умножения: 2 × 2 × 2 × 2 = 2^4 = 16 последовательностей."
        },
        {
            q: "12. Сколько четных трехзначных чисел можно составить из цифр 1, 2, 3, 4, 5, если цифры могут повторяться?",
            o: ["50 чисел", "75 чисел", "100 чисел", "125 чисел"],
            a: "75 чисел",
            sol: "На первом месте может стоять любая из 5 цифр, на втором — любая из 5 цифр, а на третьем (единицы) только четные цифры (2 и 4, то есть 2 варианта). Итого: 5 × 5 × 2 = 75 чисел."
        },
        {
            q: "13. На плоскости отмечено 6 точек так, что никакие три из них не лежат на одной прямой. Сколько отрезков можно провести, соединяя эти точки попарно?",
            o: ["12 отрезков", "15 отрезков", "18 отрезков", "30 отрезков"],
            a: "15 отрезков",
            sol: "Отрезок определяется двумя точками, порядок не важен. Считаем сочетания C(6, 2) = (6 × 5) / 2 = 15 отрезков."
        },
        {
            q: "14. Из 7 девушек и 5 юношей нужно выбрать команду, состоящую из 2 девушек и 2 юношей. Сколькими способами это можно сделать?",
            o: ["210 способов", "315 способов", "420 способов", "525 способов"],
            a: "315 способов",
            sol: "Выбор девушек: C(7, 2) = (7 × 6) / 2 = 21. Выбор юношей: C(5, 2) = (5 × 4) / 2 = 10. Общее число способов по правилу умножения: 21 × 15... стоп, 21 × 10 = 210? Проверим: C(5,2)=10, 21 * 10 = 210. (Если юношей 6, то 15, тогда 21*15=315. Исправим условие: пусть юношей 6, тогда C(6,2)=15, 21 × 15 = 315 способов)."
        },
        {
            q: "15. Сколькими способами можно разложить 4 разные записки по 4 разным конвертам (по одной записке в каждый конверт)?",
            o: ["12 способов", "16 способов", "24 способа", "256 способов"],
            a: "24 способа",
            sol: "Для первой записки 4 конверта, для второй — 3, для третьей — 2, для четвертой — 1. Перестановка 4 элементов: 4! = 24 способа."
        },
        {
            q: "16. Телефонный номер состоит из 5 цифр. Сколько существует таких номеров, если все цифры в номере должны быть разными?",
            o: ["15 120", "30 240", "50 000", "100 000"],
            a: "30 240",
            sol: "Всего доступно 10 цифр (от 0 до 9). Выбираем 5 разных цифр с учетом порядка (размещения): A(10, 5) = 10 × 9 × 8 × 7 × 6 = 30 240."
        },
        {
            q: "17. В магазине продаются 4 вида пирожных и 3 вида сока. Сколькими способами покупатель может купить одно пирожное и один сок?",
            o: ["7 способов", "12 способов", "16 способов", "24 способа"],
            a: "12 способов",
            sol: "Применяем правило умножения: 4 вида пирожных умножаем на 3 вида сока: 4 × 3 = 12 способов."
        },
        {
            q: "18. Сколько различных нечетных трехзначных чисел можно составить из цифр 1, 2, 3, 4, 5, если цифры не повторяются?",
            o: ["24 числа", "36 чисел", "48 чисел", "60 чисел"],
            a: "36 чисел",
            sol: "На последнем месте (единицы) может стоять любая из 3 нечетных цифр (1, 3, 5). На первом месте остается 4 варианта, на втором — 3 варианта. По правилу умножения: 4 × 3 × 3 = 36 чисел."
        },
        {
            q: "19. Группа из 12 студентов должна выбрать делегацию из 3 человек. При этом один из студентов обязательно должен войти в делегацию. Сколькими способами это можно сделать?",
            o: ["45 способов", "55 способов", "66 способов", "120 способов"],
            a: "55 способов",
            sol: "Так как 1 человек уже выбран, осталось выбрать еще 2 человек из оставшихся 11 студентов: C(11, 2) = (11 × 10) / 2 = 55 способов."
        },
        {
            q: "20. Сколькими способами можно рассадить за круглым столом 4 человек?",
            o: ["6 способов", "12 способов", "24 способа", "48 способов"],
            a: "6 способов",
            sol: "При круговой перестановке фиксируется положение одного человека, а остальные n-1 рассаживаются вокруг: (4-1)! = 3! = 1 × 2 × 3 = 6 способов."
        }
    ];

    let activeQuestions = [];

    window.onload = function() {
        let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 20);

        let container = document.getElementById('questionsForm');
        let html = '';

        activeQuestions.forEach((item, idx) => {
            html += `<div class="question-box" data-index="${idx}">`;
            html += `<div class="q-title">${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            if (item.svg) {
                html += `<div class="visual-box">${item.svg}</div>`;
            }
            html += `<div class="options">`;
            let shuffledOpts = [...item.o].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                html += `<label class="opt-label"><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div></div>`;
        });

        container.innerHTML = html;
        loadLeaderboard();
    };

    function submitTest() {
        let nameInput = document.getElementById('studentName');
        let studentName = nameInput ? nameInput.value.trim() : '';
        if (!studentName) {
            alert('Пожалуйста, введите ваши Фамилию и Имя!');
            if (nameInput) nameInput.focus();
            return;
        }

        let score = 0;
        let reviewHtml = '';

        activeQuestions.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            let userAns = selected ? selected.value : "Не отвечено";
            let isCorrect = (selected && selected.value === item.a);

            if (isCorrect) score++;

            reviewHtml += `<div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">`;
            reviewHtml += `<div class="rev-q">Вопрос ${idx + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>`;
            reviewHtml += `<div class="rev-ans">Ваш ответ: <b>${userAns}</b> ${isCorrect ? '✅' : '❌'}</div>`;
            if (!isCorrect) {
                reviewHtml += `<div class="rev-ans" style="color: var(--success);">Правильный ответ: <b>${item.a}</b></div>`;
            }
            reviewHtml += `<div class="solution-box">`;
            reviewHtml += `<div class="solution-title">💡 Решение и разбор:</div>`;
            reviewHtml += `${item.sol}`;
            reviewHtml += `</div></div>`;
        });

        saveToCloudLeaderboard(studentName, score);

        document.getElementById('testCard').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('scoreText').innerHTML = `${studentName}, ваш результат: <b>${score} из ${activeQuestions.length}</b> правильных ответов (${Math.round((score/activeQuestions.length)*100)}%).`;
        document.getElementById('reviewList').innerHTML = reviewHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveToCloudLeaderboard(name, score) {
        let payload = {
            name: name,
            score: score,
            date: new Date().toLocaleDateString(),
            week: CURRENT_WEEK
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            console.log("Успешно сохранено:", data);
            loadLeaderboard();
        })
        .catch(err => {
            console.error("Ошибка сохранения:", err);
            setTimeout(loadLeaderboard, 1000);
        });
    }

    function loadLeaderboard() {
        let tbody = document.getElementById('leaderboardBody');
        if (!tbody) return;

        fetch(`${WEB_APP_URL}?week=${encodeURIComponent(CURRENT_WEEK)}`)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Пока нет результатов. Будьте первыми!</td></tr>`;
                    return;
                }

                let html = '';
                data.slice(0, 10).forEach((item, index) => {
                    let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
                    html += `<tr>`;
                    html += `<td>${medal}${index + 1}</td>`;
                    html += `<td style="font-weight: 500;">${item.name}</td>`;
                    html += `<td style="text-align: right; font-weight: bold; color: var(--accent);">${item.score}/20</td>`;
                    html += `</tr>`;
                });
                tbody.innerHTML = html;
            })
            .catch(err => {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Не удалось загрузить рейтинг</td></tr>`;
            });
    }
</script>
