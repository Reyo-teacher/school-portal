<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логунов Григорий Владимирович — Математика</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#0f172a',
                        cardBorder: '#1e293b',
                        cyanGlow: '#00b4d8',
                        cyanActive: '#38bdf8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090d16;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            color: #f1f5f9;
        }

        .active-btn {
            background-color: #38bdf8 !important;
            color: #090d16 !important;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .class-btn {
            transition: all 0.2s ease-in-out;
        }

        .class-btn:hover:not(.active-btn) {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.08);
            transform: translateY(-2px);
        }

        .chapter-card {
            transition: all 0.25s ease;
        }

        .chapter-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-10 font-sans flex flex-col items-center justify-start">

    <div class="w-full max-w-5xl space-y-6">

        <!-- Шапка -->
        <header class="bg-[#0f172a]/90 backdrop-blur border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h1 class="text-xl sm:text-2xl font-bold text-sky-400 tracking-wide">
                Логунов Григорий Владимирович — Математика
            </h1>
        </header>

        <!-- Главный контейнер -->
        <main class="bg-[#0f172a]/80 backdrop-blur border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl">

            <!-- Кнопка "На главную" / Навигация -->
            <div class="mb-6 flex justify-between items-center flex-wrap gap-4">
                <button id="backBtn" onclick="showClassSelection()" class="hidden px-4 py-2 text-sm font-medium text-sky-400 bg-sky-950/40 hover:bg-sky-900/60 border border-sky-800/50 rounded-xl transition duration-200 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-arrow-left"></i> На главную
                </button>
            </div>

            <!-- Раздел: Выбор класса (Главный экран) -->
            <section id="classSelectionSection">
                <h2 class="text-lg sm:text-xl font-bold text-sky-400 mb-6 pb-2 border-b border-slate-800">
                    Выберите класс или направление
                </h2>

                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
                    <!-- 5 класс (Активный кликабельный) -->
                    <button onclick="selectGrade(5)" id="btn-5" class="class-btn active-btn text-center py-4 px-3 rounded-xl border border-sky-400 text-sm sm:text-base font-semibold">
                        5 класс
                    </button>

                    <!-- Другие классы -->
                    <button onclick="selectGrade(6)" id="btn-6" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        6 класс
                    </button>
                    <button onclick="selectGrade(7)" id="btn-7" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        7 класс
                    </button>
                    <button onclick="selectGrade(8)" id="btn-8" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        8 класс
                    </button>
                    <button onclick="selectGrade(9)" id="btn-9" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        9 класс
                    </button>
                    <button onclick="selectGrade(10)" id="btn-10" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        10 класс
                    </button>
                    <button onclick="selectGrade(11)" id="btn-11" class="class-btn bg-[#162032] border border-slate-800 text-slate-200 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold">
                        11 класс
                    </button>

                    <!-- Направления -->
                    <button onclick="selectGrade('ent')" id="btn-ent" class="class-btn col-span-2 sm:col-span-2 bg-[#162a45] border border-sky-700/60 text-sky-300 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold flex items-center justify-center gap-2">
                        <span class="text-rose-400 text-base">🎯</span> ЕНТ Подготовка
                    </button>
                    <button onclick="selectGrade('trainers')" id="btn-trainers" class="class-btn col-span-2 sm:col-span-3 lg:col-span-3 bg-[#0d2826] border border-emerald-700/60 text-emerald-300 text-center py-4 px-3 rounded-xl text-sm sm:text-base font-semibold flex items-center justify-center gap-2">
                        <span class="text-amber-400 text-base">⚡</span> Интерактивные тренажёры
                    </button>
                </div>
            </section>

            <!-- Раздел: Просмотр глав 5 класса -->
            <section id="grade5ChaptersSection" class="hidden space-y-6">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-sky-400 font-semibold">Учебный курс</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-3">
                            <span class="bg-sky-500 text-slate-950 text-sm px-3 py-1 rounded-lg font-black">5 класс</span>
                            Программа и выбор глав
                        </h2>
                    </div>
                    <span class="text-xs sm:text-sm bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700">
                        Всего глав: <strong class="text-sky-400">7</strong>
                    </span>
                </div>

                <!-- Список 7 Глав -->
                <div class="grid grid-cols-1 gap-4" id="chaptersContainer">
                    <!-- Генерация через JS -->
                </div>
            </section>

        </main>
    </div>

    <!-- Скрипт переключения и данных -->
    <script>
        // Данные обо всех 7 главах 5 класса
        const chaptersData = [
            {
                number: "Глава I",
                title: "Натуральные числа и нуль",
                icon: "fa-arrow-1-9",
                topics: [
                    "1.1. Натуральные числа и нуль",
                    "1.2. Координатный луч. Изображение чисел на координатном луче",
                    "1.3. Сравнение натуральных чисел. Двойное неравенство",
                    "1.4. Сложение и вычитание натуральных чисел",
                    "1.5. Умножение и деление натуральных чисел. Основное свойство частного",
                    "1.6. Свойства арифметических действий",
                    "1.7. Арифметические действия над натуральными числами",
                    "1.8. Числовые и буквенные выражения",
                    "1.9. Упрощение выражений",
                    "1.10. Уравнение",
                    "1.11. Формулы. Вычисление по формулам",
                    "1.12. Числовые последовательности"
                ]
            },
            {
                number: "Глава II",
                title: "Делимость натуральных чисел",
                icon: "fa-divide",
                topics: [
                    "2.1. Делители натурального числа. Кратные натурального числа",
                    "2.2. Простые числа. Составные числа",
                    "2.3. Основные свойства делимости",
                    "2.4. Признаки делимости натуральных чисел на 2, 5 и 10",
                    "2.5. Признаки делимости натуральных чисел на 3 и на 9",
                    "2.6. Степень числа",
                    "2.7. Разложение составных чисел на простые множители",
                    "2.8. Наибольший общий делитель (НОД). Взаимно простые числа",
                    "2.9. Наименьшее общее кратное (НОК)",
                    "2.10. Движение по реке"
                ]
            },
            {
                number: "Глава III",
                title: "Обыкновенные дроби и действия над ними",
                icon: "fa-pie-chart",
                topics: [
                    "3.1. Обыкновенная дробь. Чтение и запись обыкновенных дробей",
                    "3.2. Основное свойство дроби. Сокращение дробей",
                    "3.3. Правильные дроби. Неправильные дроби",
                    "3.4. Смешанные числа",
                    "3.5. Сложение и вычитание обыкновенных дробей с одинаковыми знаменателями",
                    "3.6. Сложение и вычитание смешанных чисел",
                    "3.7. Вычитание дроби из натурального числа",
                    "3.8. Сложение и вычитание обыкновенных дробей с разными знаменателями"
                ]
            },
            {
                number: "Глава IV",
                title: "Десятичные дроби и действия над ними",
                icon: "fa-calculator",
                topics: [
                    "4.1. Понятие десятичной дроби",
                    "4.2. Сравнение десятичных дробей",
                    "4.3. Сложение и вычитание десятичных дробей",
                    "4.4. Умножение десятичных дробей",
                    "4.5. Деление десятичных дробей",
                    "4.6. Округление чисел",
                    "4.7. Среднее арифметическое"
                ]
            },
            {
                number: "Глава V",
                title: "Отношения и пропорции. Проценты",
                icon: "fa-percent",
                topics: [
                    "5.1. Отношение двух чисел",
                    "5.2. Проценты",
                    "5.3. Пропорция",
                    "5.4. Прямая и обратная пропорциональные зависимости",
                    "5.5. Окружность и круг",
                    "5.6. Шар и сфера"
                ]
            },
            {
                number: "Глава VI",
                title: "Положительные и отрицательные числа. Координаты на плоскости",
                icon: "fa-plus-minus",
                topics: [
                    "6.1. Положительные и отрицательные числа",
                    "6.2. Координатная прямая",
                    "6.3. Модуль числа",
                    "6.4. Сравнение рациональных чисел",
                    "6.5. Сложение и вычитание рациональных чисел",
                    "6.6. Умножение и деление рациональных чисел",
                    "6.7. Прямоугольная система координат на плоскости"
                ]
            },
            {
                number: "Раздел VII",
                title: "Итоговое повторение курса математики за 5 класс",
                icon: "fa-award",
                topics: [
                    "Повторение: Натуральные числа и нуль",
                    "Повторение: Делимость натуральных чисел",
                    "Повторение: Обыкновенные дроби",
                    "Повторение: Десятичные дроби",
                    "Повторение: Отношения, пропорции и проценты",
                    "Повторение: Положительные и отрицательные числа"
                ]
            }
        ];

        // Отрисовка карточек глав
        function renderChapters() {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = chaptersData.map((ch, index) => `
                <div class="chapter-card bg-[#141e33] border border-slate-800 rounded-xl overflow-hidden">
                    <button onclick="toggleChapter(${index})" class="w-full text-left p-4 sm:p-5 flex items-center justify-between gap-4 focus:outline-none">
                        <div class="flex items-center gap-3 sm:gap-4">
                            <div class="w-10 h-10 rounded-lg bg-sky-950/80 border border-sky-800/60 text-sky-400 flex items-center justify-center font-bold text-lg shrink-0">
                                <i class="fa-solid ${ch.icon}"></i>
                            </div>
                            <div>
                                <span class="text-xs font-semibold text-sky-400 uppercase tracking-wide">${ch.number}</span>
                                <h3 class="text-base sm:text-lg font-bold text-slate-100">${ch.title}</h3>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 text-slate-400">
                            <span class="text-xs hidden sm:inline bg-slate-900 px-2.5 py-1 rounded-md text-slate-400 border border-slate-800">${ch.topics.length} тем</span>
                            <i id="chevron-${index}" class="fa-solid fa-chevron-down text-sm transition-transform duration-200"></i>
                        </div>
                    </button>
                    
                    <div id="topics-${index}" class="hidden bg-[#0b1322] border-t border-slate-800/80 p-4 sm:p-5">
                        <ul class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-slate-300">
                            ${ch.topics.map(topic => `
                                <li class="flex items-center gap-2.5 p-2 rounded-lg hover:bg-slate-800/50 cursor-pointer text-slate-300 hover:text-sky-300 transition">
                                    <i class="fa-regular fa-circle-dot text-xs text-sky-500"></i>
                                    <span>${topic}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        // Выбор класса
        function selectGrade(grade) {
            // Подсветка кнопок
            document.querySelectorAll('.class-btn').forEach(btn => btn.classList.remove('active-btn'));
            const activeBtn = document.getElementById(`btn-${grade}`);
            if (activeBtn) activeBtn.classList.add('active-btn');

            if (grade === 5) {
                document.getElementById('classSelectionSection').classList.add('hidden');
                document.getElementById('grade5ChaptersSection').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
            } else {
                alert(`Раздел для ${grade} класса в процессе наполнения.`);
            }
        }

        // Возврат на выбор класса
        function showClassSelection() {
            document.getElementById('grade5ChaptersSection').classList.add('hidden');
            document.getElementById('classSelectionSection').classList.remove('hidden');
            document.getElementById('backBtn').classList.add('hidden');
        }

        // Разворачивание темы внутри главы
        function toggleChapter(index) {
            const content = document.getElementById(`topics-${index}`);
            const chevron = document.getElementById(`chevron-${index}`);
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        // Инициализация
        window.onload = function() {
            renderChapters();
        };
    </script>
</body>
</html>
