<script>
/* BACK_URL — страница выбора раздела ЕНТ */
const BACK_URL = "ent.html";

/* ============================================================
   ПЛАН ЗАНЯТИЙ (34 недели)
   Для каждого занятия можно заполнить:
     lecture      — HTML лекции (формулы в $...$ и $$...$$)
     tasks        — задачи практики: {q, options:[], answer:индекс, explain}
     practiceUrl  — ссылка на готовый тренажёр (если есть)
   mock:true — пробный ЕНТ: одна страница без деления на лекцию и практику
   34 занятия: 32 учебных остановки и два авторских пробных ЕНТ.
   ============================================================ */
const TOPICS = [
  {"n": 1, "m": "Сентябрь", "t": "Входная диагностика; структура ЕНТ по профильной математике", "diagnostic": true, "lecture": "<p class=\"pm-rule\"><strong>Зачем диагностика?</strong> Чтобы понять, с чего начать. Это не пробный ЕНТ и не прогноз результата экзамена.</p>\n<p>Реши 20 задач без подсказок. После проверки увидишь, где есть пробел: числа и выражения, уравнения, графики или геометрия.</p>\n<h3>Как устроен профильный ЕНТ</h3><p>40 заданий: 25 обычных с одним ответом, 5 с одним ответом по общему контексту, 5 с одним или несколькими верными ответами и 5 на соответствие. Максимум — 50 баллов.</p>\n<p><a href=\"https://new.testcenter.kz/?lang=ru&amp;page_id=15094\">Спецификации и образцы НЦТ</a></p>\n<p><a class=\"pm-btn\" href=\"#/t/1/practice\">Начать диагностику</a></p>", "tasks": [{"q": "Упрости $\\sqrt{75}$.", "options": ["$5\\sqrt3$", "$3\\sqrt5$", "$25\\sqrt3$", "$15\\sqrt5$"], "answer": 0, "explain": "$75=25\\cdot3$, поэтому $\\sqrt{75}=5\\sqrt3$.", "skill": "numbers"}, {"q": "Вычисли $3^4:3^2$.", "options": ["3", "6", "27", "9"], "answer": 3, "explain": "При делении степеней с одной основой вычитаем показатели: $3^{4-2}=9$.", "skill": "numbers"}, {"q": "Разложи $x^2-25$ на множители.", "options": ["$(x-5)^2$", "$(x-5)(x+5)$", "$(x-25)(x+1)$", "$(x-5)(x+1)$"], "answer": 1, "explain": "Разность квадратов: $x^2-5^2=(x-5)(x+5)$.", "skill": "expressions"}, {"q": "При каком $x$ выражение $\\frac{1}{x-3}$ не определено?", "options": ["$x=0$", "$x=-3$", "$x=3$", "$x=1$"], "answer": 2, "explain": "Знаменатель не может быть нулём. $x-3=0$ при $x=3$.", "skill": "expressions"}, {"q": "Реши $4x-7=9$.", "options": ["$x=4$", "$x=2$", "$x=-4$", "$x=\\frac12$"], "answer": 0, "explain": "Прибавляем 7: $4x=16$. Делим на 4: $x=4$.", "skill": "equations"}, {"q": "Реши $x^2=9$.", "options": ["$x=9$", "$x=3$", "$x=-3$", "$x=-3$ или $x=3$"], "answer": 3, "explain": "Квадрат и числа $3$, и числа $-3$ равен 9.", "skill": "equations"}, {"q": "Если $f(x)=2x-1$, чему равно $f(3)$?", "options": ["6", "5", "3", "−5"], "answer": 1, "explain": "Подставляем вместо $x$ число 3: $2\\cdot3-1=5$.", "skill": "graphs"}, {"q": "При каком $x$ график $y=-2x+6$ пересекает ось $x$?", "options": ["$x=-3$", "$x=6$", "$x=3$", "$x=0$"], "answer": 2, "explain": "На оси $x$ значение $y=0$. Решаем $-2x+6=0$, откуда $x=3$.", "skill": "graphs"}, {"q": "У прямоугольного треугольника катеты 6 и 8. Найди гипотенузу.", "options": ["10", "14", "7", "100"], "answer": 0, "explain": "По теореме Пифагора $c^2=6^2+8^2=100$, значит $c=10$.", "skill": "geometry"}, {"q": "Основание треугольника равно 8 см, высота к нему — 3 см. Найди площадь.", "options": ["24 см²", "16 см²", "11 см²", "12 см²"], "answer": 3, "explain": "$S=8\\cdot3:2=12$ см².", "skill": "geometry"}]},
  {"n": 2, "m": "Сентябрь", "t": "Числа и выражения: радикалы, степени", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Степень говорит, сколько раз берём множитель. Квадратный корень отвечает на вопрос: какое неотрицательное число в квадрате даёт исходное число?</p><figure class=\"pm-figure\"><svg viewBox=\"0 0 380 170\" role=\"img\" aria-label=\"Решётка шесть на шесть: 36 маленьких квадратов, сторона большого квадрата равна 6.\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"126\" y=\"16\" width=\"132\" height=\"132\" rx=\"4\" fill=\"#dbeef8\" stroke=\"#35749c\" stroke-width=\"2\"/><path d=\"M148 16v132m22-132v132m22-132v132m22-132v132m22-132v132M126 38h132m-132 22h132m-132 22h132m-132 22h132m-132 22h132\" stroke=\"#8cb3ce\"/><text x=\"192\" y=\"88\" font-size=\"22\" text-anchor=\"middle\">36</text><text x=\"273\" y=\"85\" font-size=\"17\">6</text><text x=\"192\" y=\"166\" font-size=\"17\" text-anchor=\"middle\">6</text></svg><figcaption>Площадь квадрата — 36. Длина стороны — √36 = 6. Корень из числа сам по себе не отрицателен.</figcaption></figure>\n<h3>Что запомнить</h3><ul><li>При умножении степеней с одинаковой основой показатели складываем: $a^m\\cdot a^n=a^{m+n}$.</li><li>При делении вычитаем: $a^m:a^n=a^{m-n}$, если $a\\ne0$. Например, $2^{-3}=1/2^3=1/8$.</li><li>Из-под корня можно вынести квадратный множитель: $\\sqrt{72}=\\sqrt{36\\cdot2}=6\\sqrt2$. Складывать можно одинаковые корни: $6\\sqrt2-2\\sqrt2=4\\sqrt2$.</li></ul>\n<div class=\"pm-rule\"><strong>Проверь себя.</strong> $\\sqrt{x^2}=|x|$, не всегда $x$. Например, $\\sqrt{(-5)^2}=5$.</div>\n<p><a class=\"pm-btn\" href=\"#/t/2/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Упрости $\\sqrt{48}$.", "options": ["$2\\sqrt3$", "$4\\sqrt3$", "$12\\sqrt3$", "$3\\sqrt{16}$"], "answer": 1, "explain": "$48=16\\cdot3$. Значит $\\sqrt{48}=4\\sqrt3$."}, {"q": "Вычисли $2^3\\cdot2^4$.", "options": ["64", "256", "14", "128"], "answer": 3, "explain": "Складываем показатели: $2^7=128$."}, {"q": "Чему равно $3^{-2}$?", "options": ["$\\frac19$", "$-9$", "$\\frac16$", "$9$"], "answer": 0, "explain": "Отрицательная степень даёт обратное число: $3^{-2}=1/3^2=1/9$."}, {"q": "Упрости $\\sqrt{(-7)^2}$.", "options": ["−7", "49", "7", "−49"], "answer": 2, "explain": "$\\sqrt{(-7)^2}=\\sqrt{49}=7$."}, {"q": "Упрости $\\sqrt{50}-\\sqrt8$.", "options": ["$\\sqrt2$", "$3\\sqrt2$", "$7\\sqrt2$", "$\\sqrt{42}$"], "answer": 1, "explain": "$\\sqrt{50}=5\\sqrt2$, $\\sqrt8=2\\sqrt2$. Разность равна $3\\sqrt2$."}, {"q": "Вычисли $(2^3)^2:2^4$.", "options": ["2", "8", "16", "4"], "answer": 3, "explain": "Степень степени: $(2^3)^2=2^6$. Делим: $2^{6-4}=4$."}, {"q": "При каком условии определено $\\sqrt{x-4}$ в действительных числах?", "options": ["$x\\ge4$", "$x>4$", "$x\\le4$", "При любом $x$"], "answer": 0, "explain": "Под корнем должно быть число не меньше нуля: $x-4\\ge0$."}]},
  {"n": 3, "m": "Сентябрь", "t": "Дробные и целые выражения; формулы сокращённого умножения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Чтобы упростить дробь, разложи числитель и знаменатель на множители. Сократить можно общий множитель, но не часть суммы.</p><figure class=\"pm-figure\"><svg viewBox=\"0 0 380 170\" role=\"img\" aria-label=\"Квадрат со стороной a плюс b разбит на четыре части: a в квадрате, два прямоугольника ab и b в квадрате.\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"88\" y=\"15\" width=\"104\" height=\"104\" fill=\"#cde8f7\"/><rect x=\"192\" y=\"15\" width=\"45\" height=\"104\" fill=\"#d4f0df\"/><rect x=\"88\" y=\"119\" width=\"104\" height=\"45\" fill=\"#d4f0df\"/><rect x=\"192\" y=\"119\" width=\"45\" height=\"45\" fill=\"#fae6ac\"/><path d=\"M88 15h149v149H88zM192 15v149M88 119h149\" stroke=\"#3e6888\" stroke-width=\"2\" fill=\"none\"/><g text-anchor=\"middle\" font-size=\"18\"><text x=\"142\" y=\"72\">a²</text><text x=\"221\" y=\"72\">ab</text><text x=\"142\" y=\"148\">ab</text><text x=\"221\" y=\"148\">b²</text></g><text x=\"257\" y=\"91\" font-size=\"16\">a + b</text></svg><figcaption>Два зелёных прямоугольника дают 2ab. Их нельзя потерять при раскрытии квадрата суммы.</figcaption></figure>\n<h3>Три полезные формулы</h3><ul><li>$(a+b)^2=a^2+2ab+b^2$.</li><li>$(a-b)^2=a^2-2ab+b^2$.</li><li>$a^2-b^2=(a-b)(a+b)$.</li></ul>\n<h3>Пример с дробью</h3><ol><li>В дроби $\\frac{x^2-9}{x-3}$ сначала запиши ограничение: $x\\ne3$.</li><li>Разложи числитель: $x^2-9=(x-3)(x+3)$.</li><li>Сократи общий множитель: получится $x+3$, но запрет $x\\ne3$ остаётся.</li></ol>\n<p><a class=\"pm-btn\" href=\"#/t/3/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Раскрой скобки: $(x+4)^2$.", "options": ["$x^2+16$", "$x^2+4x+16$", "$x^2+8x+16$", "$x^2-8x+16$"], "answer": 2, "explain": "Средний член равен $2\\cdot x\\cdot4=8x$."}, {"q": "Разложи $9a^2-16$.", "options": ["$(3a-4)(3a+4)$", "$(9a-4)(a+4)$", "$(3a-4)^2$", "$(3a+4)^2$"], "answer": 0, "explain": "$9a^2-16=(3a)^2-4^2$. Применяем разность квадратов."}, {"q": "Упрости $3x(2x-5)+4x$.", "options": ["$6x^2-15x$", "$6x^2-19x$", "$6x^2-x$", "$6x^2-11x$"], "answer": 3, "explain": "Раскрываем скобки: $6x^2-15x+4x=6x^2-11x$."}, {"q": "Сократи $\\frac{x^2-16}{x-4}$, сохранив ограничение.", "options": ["$x-4$ при $x\\ne4$", "$x+4$ при $x\\ne4$", "$x+4$ для всех $x$", "$x-4$ при $x\\ne-4$"], "answer": 1, "explain": "Разложение: $(x-4)(x+4)$. Сокращаем при $x\\ne4$."}, {"q": "Упрости $(x-3)^2-x(x-6)$.", "options": ["−9", "$-12x+9$", "9", "$6x+9$"], "answer": 2, "explain": "$x^2-6x+9-(x^2-6x)=9$."}, {"q": "Упрости $(\\frac{2a}{b})^3$ при $b\\ne0$.", "options": ["$\\frac{8a^3}{b^3}$", "$\\frac{6a^3}{b^3}$", "$\\frac{8a}{b^3}$", "$\\frac{2a^3}{b}$"], "answer": 0, "explain": "Возводим каждый множитель в степень: $2^3=8$, числитель содержит $a^3$, знаменатель — $b^3$."}, {"q": "При каких значениях определена дробь $\\frac{x+7}{x^2-4}$?", "options": ["При всех $x$", "$x\\ne2$", "$x\\ne-2$", "$x\\ne-2$ и $x\\ne2$"], "answer": 3, "explain": "$x^2-4=(x-2)(x+2)$. Знаменатель равен нулю при $2$ и $-2$."}]},
  {"n": 4, "m": "Сентябрь", "t": "Линейные и квадратные уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Решить уравнение значит найти все значения, при которых левая часть равна правой. Если перенести всё в левую часть и построить её график, корни — это значения $x$, при которых $y=0$.</p><figure class=\"pm-figure\"><svg viewBox=\"0 0 380 170\" role=\"img\" aria-label=\"График y равно x в квадрате минус 5x плюс 6. Парабола пересекает горизонтальную ось в точках 2 и 3.\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M35 122H330M87 15v150\" stroke=\"#406481\" stroke-width=\"2\"/><g stroke=\"#b8cbd9\"><path d=\"M87 122v-3m41 3v-3m41 3v-3m41 3v-3m41 3v-3m41 3v-3\"/></g><polyline points=\"87.00,26.00 89.05,29.96 91.10,33.84 93.15,37.64 95.20,41.36 97.25,45.00 99.30,48.56 101.35,52.04 103.40,55.44 105.45,58.76 107.50,62.00 109.55,65.16 111.60,68.24 113.65,71.24 115.70,74.16 117.75,77.00 119.80,79.76 121.85,82.44 123.90,85.04 125.95,87.56 128.00,90.00 130.05,92.36 132.10,94.64 134.15,96.84 136.20,98.96 138.25,101.00 140.30,102.96 142.35,104.84 144.40,106.64 146.45,108.36 148.50,110.00 150.55,111.56 152.60,113.04 154.65,114.44 156.70,115.76 158.75,117.00 160.80,118.16 162.85,119.24 164.90,120.24 166.95,121.16 169.00,122.00 171.05,122.76 173.10,123.44 175.15,124.04 177.20,124.56 179.25,125.00 181.30,125.36 183.35,125.64 185.40,125.84 187.45,125.96 189.50,126.00 191.55,125.96 193.60,125.84 195.65,125.64 197.70,125.36 199.75,125.00 201.80,124.56 203.85,124.04 205.90,123.44 207.95,122.76 210.00,122.00 212.05,121.16 214.10,120.24 216.15,119.24 218.20,118.16 220.25,117.00 222.30,115.76 224.35,114.44 226.40,113.04 228.45,111.56 230.50,110.00 232.55,108.36 234.60,106.64 236.65,104.84 238.70,102.96 240.75,101.00 242.80,98.96 244.85,96.84 246.90,94.64 248.95,92.36 251.00,90.00 253.05,87.56 255.10,85.04 257.15,82.44 259.20,79.76 261.25,77.00 263.30,74.16 265.35,71.24 267.40,68.24 269.45,65.16 271.50,62.00 273.55,58.76 275.60,55.44 277.65,52.04 279.70,48.56 281.75,45.00 283.80,41.36 285.85,37.64 287.90,33.84 289.95,29.96 292.00,26.00\" fill=\"none\" stroke=\"#28669d\" stroke-width=\"3\"/><circle cx=\"169\" cy=\"122\" r=\"5\" fill=\"#ae552f\"/><circle cx=\"210\" cy=\"122\" r=\"5\" fill=\"#ae552f\"/><g font-size=\"16\" text-anchor=\"middle\"><text x=\"169\" y=\"148\">2</text><text x=\"210\" y=\"148\">3</text><text x=\"335\" y=\"125\">x</text><text x=\"91\" y=\"15\">y</text></g></svg><figcaption>На оси x значение y равно нулю. Поэтому абсциссы точек пересечения — корни уравнения.</figcaption></figure>\n<h3>Линейное уравнение</h3><p>Собери слагаемые с $x$ в одной части, числа — в другой. Например, $3x-5=7$: получаем $3x=12$, значит $x=4$. Если коэффициент при $x$ равен нулю, остаётся либо верное равенство (подходит любое $x$), либо неверное (решений нет).</p>\n<h3>Квадратное уравнение</h3><p>Приведи его к виду $ax^2+bx+c=0$, где $a\\ne0$. Дискриминант $D=b^2-4ac$:</p>\n<ul><li>$D>0$: два корня, $x_{1,2}=\\frac{-b\\pm\\sqrt D}{2a}$.</li><li>$D=0$: один корень, $x=-\\frac{b}{2a}$.</li><li>$D<0$: действительных корней нет.</li></ul>\n<div class=\"pm-rule\"><strong>Пример.</strong> $x^2-5x+6=0$: $D=25-24=1$, корни 2 и 3. Можно быстрее: по Виету ищем два числа с суммой 5 и произведением 6. На рисунке парабола пересекает ось именно в этих точках.</div><p><a class=\"pm-btn\" href=\"#/t/4/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши $5x+3=18$.", "options": ["$x=2$", "$x=4$", "$x=3$", "$x=-3$"], "answer": 2, "explain": "Вычитаем 3: $5x=15$. Делим на 5: $x=3$."}, {"q": "Найди корни $x^2-5x+6=0$.", "options": ["$2$ и $3$", "$-2$ и $-3$", "$1$ и $6$", "$-1$ и $6$"], "answer": 0, "explain": "По Виету сумма равна 5, а произведение 6. Подходят 2 и 3."}, {"q": "Найди сумму корней $x^2-7x+10=0$.", "options": ["−7", "10", "−10", "7"], "answer": 3, "explain": "По Виету сумма равна числу с противоположным знаком к коэффициенту при $x$: $7$."}, {"q": "При каком $a$ уравнение $ax=6$ не имеет корней?", "options": ["$a=6$", "$a=0$", "$a=1$", "Корень есть при любом $a$"], "answer": 1, "explain": "При $a=0$ имеем неверное равенство $0=6$. При ненулевом $a$ можно разделить на $a$."}, {"q": "Сколько действительных корней имеет $x^2+2x+5=0$?", "options": ["Один", "Два", "Ни одного", "Бесконечно много"], "answer": 2, "explain": "$D=4-20=-16<0$. Действительных корней нет."}, {"q": "Реши $2x^2-8x=0$.", "options": ["$0$ и $4$", "Только $4$", "$0$ и $-4$", "$2$ и $4$"], "answer": 0, "explain": "Выносим $2x$: $2x(x-4)=0$. Значит $x=0$ или $x=4$."}, {"q": "У параболы $y=x^2-6x+9$ сколько общих точек с осью $x$?", "options": ["Ни одной", "Две", "Три", "Одна"], "answer": 3, "explain": "$y=(x-3)^2$, поэтому $y=0$ только при $x=3$. Парабола касается оси."}]},
  {"n": 5, "m": "Октябрь", "t": "Дробно-рациональные уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Сначала выпиши значения, при которых знаменатели равны нулю. Это ограничения области допустимых значений (ОДЗ).</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"ОДЗ → Уравнение → Проверка\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">ОДЗ</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Уравнение</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Проверка</text></svg></figure><aside class=\"pm-rule\">Геометрическая разминка: у прямоугольного треугольника катеты 6 и 8. Гипотенуза √(36 + 64) = 10. Это правило вернётся в стереометрии.</aside><h3>Пример по шагам</h3><p><strong>(x + 1)/(x − 2) = 3</strong></p><ol><li>Запрет: x ≠ 2.</li><li>Умножаем на x − 2: x + 1 = 3x − 6.</li><li>2x = 7. Ответ: x = 7/2; запрет не нарушен.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Сокращение не отменяет исходный запрет.</div><p><a class=\"pm-btn\" href=\"#/t/5/practice\">Перейти к практике</a></p>", "tasks": [{"q": "(x + 2)/(x − 1) = 2. Найди x.", "options": ["1", "−4", "2", "4"], "answer": 3, "explain": "x + 2 = 2x − 2, откуда x = 4. x ≠ 1."}, {"q": "1/x + 1/3 = 2/3. Найди x.", "options": ["1", "3", "−3", "0"], "answer": 1, "explain": "1/x = 1/3, значит x = 3."}, {"q": "(x² − 9)/(x − 3) = 6. Найди все корни.", "options": ["Нет корней", "0", "3", "−3"], "answer": 0, "explain": "При x ≠ 3 остаётся x + 3 = 6. Единственный кандидат 3 запрещён."}, {"q": "2/(x + 1) = 1/(x − 2). Найди x.", "options": ["1", "5", "2", "−5"], "answer": 1, "explain": "x ≠ −1, 2. Из 2x − 4 = x + 1 получаем x = 5."}]},
  {"n": 6, "m": "Октябрь", "t": "Иррациональные уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Квадратный корень неотрицателен. Если √A = B, нужны A ≥ 0 и B ≥ 0. После возведения в квадрат проверь кандидатов.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Ограничения → Квадрат → Подстановка\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Ограничения</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Квадрат</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Подстановка</text></svg></figure><h3>Пример по шагам</h3><p><strong>√(x + 5) = x − 1</strong></p><ol><li>Правая часть неотрицательна при x ≥ 1.</li><li>После возведения в квадрат: x² − 3x − 4 = 0, кандидаты 4 и −1.</li><li>−1 не подходит. При 4 обе части равны 3.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> После возведения в квадрат могут появиться посторонние корни.</div><p><a class=\"pm-btn\" href=\"#/t/6/practice\">Перейти к практике</a></p>", "tasks": [{"q": "√(x + 4) = 5. Найди x.", "options": ["−21", "25", "21", "9"], "answer": 2, "explain": "x + 4 = 25, значит x = 21."}, {"q": "√(2x − 1) = −3. Сколько корней?", "options": ["0", "3", "1", "2"], "answer": 0, "explain": "Левая часть неотрицательна, а правая отрицательна."}, {"q": "√(x + 2) = x. Найди x.", "options": ["−1 и 2", "−1", "2", "0"], "answer": 2, "explain": "x ≥ 0. Кандидаты 2 и −1 из x² − x − 2 = 0. Подходит только 2."}, {"q": "√(3x + 1) = √(x + 7). Найди x.", "options": ["−3", "3", "4", "6"], "answer": 1, "explain": "Приравниваем подкоренные выражения: 3x + 1 = x + 7; x = 3, обе части определены."}]},
  {"n": 7, "m": "Октябрь", "t": "Показательные уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Приводи степени к одной основе. Если a &gt; 0 и a ≠ 1, равенство aᵘ = aᵛ означает u = v.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Одна основа → Показатели → Ответ\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Одна основа</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Показатели</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Ответ</text></svg></figure><aside class=\"pm-rule\">Графики: если a &gt; 1, линия y = aˣ идёт вверх; если 0 &lt; a &lt; 1, вниз. В обоих случаях она проходит через (0; 1). Это пригодится в неравенствах.</aside><h3>Пример по шагам</h3><p><strong>9ˣ = 27</strong></p><ol><li>Пишем 9 = 3², 27 = 3³.</li><li>Получаем 3²ˣ = 3³, значит 2x = 3.</li><li>Ответ: 3/2.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Если ввёл замену t = aˣ, то t &gt; 0.</div><p><a class=\"pm-btn\" href=\"#/t/7/practice\">Перейти к практике</a></p>", "tasks": [{"q": "2ˣ⁺¹ = 16. Найди x.", "options": ["4", "5", "2", "3"], "answer": 3, "explain": "16 = 2⁴. Приравниваем показатели: x + 1 = 4."}, {"q": "5²ˣ = 125. Найди x.", "options": ["2/3", "3/2", "3", "5/2"], "answer": 1, "explain": "125 = 5³, значит 2x = 3."}, {"q": "(1/3)ˣ = 9. Найди x.", "options": ["3", "−2", "2", "−3"], "answer": 1, "explain": "(1/3)ˣ = 3⁻ˣ; 9 = 3², поэтому −x = 2."}, {"q": "4ˣ − 5·2ˣ + 4 = 0. Найди x.", "options": ["Только 2", "0 и 2", "1 и 4", "−1 и 2"], "answer": 1, "explain": "При t = 2ˣ получаем (t − 1)(t − 4) = 0. Отсюда x = 0 или x = 2."}]},
  {"n": 8, "m": "Октябрь", "t": "Логарифмы и их свойства", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Логарифм logₐb — показатель степени: a в этой степени равно b. Здесь a &gt; 0, a ≠ 1, b &gt; 0.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Основа → Показатель → Аргумент\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Основа</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Показатель</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Аргумент</text></svg></figure><aside class=\"pm-rule\">Для положительных b и c: logₐ(b·c) = logₐb + logₐc; logₐ(b/c) = logₐb − logₐc.</aside><h3>Пример по шагам</h3><p><strong>log₂(32/4)</strong></p><ol><li>32/4 = 8.</li><li>2³ = 8.</li><li>Значит log₂(32/4) = 3.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Логарифм суммы нельзя разбивать в сумму логарифмов. Для произведения это можно.</div><p><a class=\"pm-btn\" href=\"#/t/8/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Вычисли log₃27.", "options": ["27", "3", "9", "−3"], "answer": 1, "explain": "3³ = 27."}, {"q": "Вычисли log₂8 + log₂4.", "options": ["6", "4", "5", "2"], "answer": 2, "explain": "Это 3 + 2 = 5."}, {"q": "Вычисли log₅(1/25).", "options": ["−2", "2", "−5", "4"], "answer": 0, "explain": "1/25 = 5⁻²."}, {"q": "При каких x существует log₃(x − 4)?", "options": ["x ≥ 4", "x ≠ 4", "x &lt; 4", "x &gt; 4"], "answer": 3, "explain": "Аргумент строго положителен: x − 4 &gt; 0."}]},
  {"n": 9, "m": "Ноябрь", "t": "Логарифмические уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Сначала проверь, что все аргументы положительны. При одинаковой допустимой основе равные логарифмы имеют равные аргументы.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"ОДЗ → Аргументы → Проверка\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">ОДЗ</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Аргументы</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Проверка</text></svg></figure><h3>Пример по шагам</h3><p><strong>log₂(x − 1) + log₂(x + 2) = 2</strong></p><ol><li>ОДЗ: x &gt; 1.</li><li>Объединяем: (x − 1)(x + 2) = 4. Получаем x² + x − 6 = 0.</li><li>Кандидаты 2 и −3. ОДЗ выполняется только для 2.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Даже если произведение положительно, каждый аргумент отдельно должен быть положительным.</div><p><a class=\"pm-btn\" href=\"#/t/9/practice\">Перейти к практике</a></p>", "tasks": [{"q": "log₃(x + 2) = 2. Найди x.", "options": ["9", "5", "−1", "7"], "answer": 3, "explain": "x + 2 = 3² = 9."}, {"q": "log₂(x − 3) = log₂(7 − x). Найди x.", "options": ["5", "4", "7", "3"], "answer": 0, "explain": "Из x − 3 = 7 − x получаем x = 5. Оба аргумента положительны."}, {"q": "log₅(x²) = 2. Найди все корни.", "options": ["−25 и 25", "Только 5", "−5 и 5", "Только −5"], "answer": 2, "explain": "x² = 25, оба ненулевых корня допустимы."}, {"q": "log₂x + log₂(x − 2) = 3. Найди x.", "options": ["2", "4", "4 и −2", "−2"], "answer": 1, "explain": "При x &gt; 2 получаем x(x − 2) = 8. Из кандидатов 4 и −2 подходит 4."}]},
  {"n": 10, "m": "Ноябрь", "t": "Тригонометрия: окружность и формулы приведения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> На единичной окружности cos t — горизонтальная координата, sin t — вертикальная. Знак читаем по четверти.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Единичная окружность: горизонтальная координата — косинус, вертикальная — синус.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"180\" cy=\"73\" r=\"55\" fill=\"#def0fe\" stroke=\"#3373a0\" stroke-width=\"2\"/><path d=\"M80 73h210M180 12v121M180 73l48-27m0 0v27\" fill=\"none\" stroke=\"#426a83\" stroke-width=\"2\"/><circle cx=\"228\" cy=\"46\" r=\"4\" fill=\"#9d5427\"/><text x=\"265\" y=\"93\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">cos t</text><text x=\"159\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">sin t</text></svg></figure><aside class=\"pm-rule\">Связь с графиками: у точки на окружности при 60° координаты (1/2; √3/2). Первая отвечает за cos, вторая за sin.</aside><h3>Пример по шагам</h3><p><strong>Найди sin(150°)</strong></p><ol><li>150° лежит во II четверти; вертикальная координата положительна.</li><li>150° = 180° − 30°; точки симметричны относительно вертикальной оси.</li><li>sin(150°) = sin(30°) = 1/2.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> π радиан = 180°. Не смешивай радианы и градусы в одном вычислении.</div><p><a class=\"pm-btn\" href=\"#/t/10/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Чему равен cos 60°?", "options": ["1/2", "−1/2", "0", "√3/2"], "answer": 0, "explain": "На единичной окружности точка угла 60° имеет x = 1/2."}, {"q": "Какой знак у sin 240°?", "options": ["Отрицательный", "Равен нулю", "Зависит от радиуса", "Положительный"], "answer": 0, "explain": "240° лежит в III четверти; y отрицателен."}, {"q": "Чему равен cos(π − π/3)?", "options": ["1/2", "0", "−1/2", "−√3/2"], "answer": 2, "explain": "Отражение во II четверть меняет знак косинуса: −cos(π/3)."}, {"q": "Сколько градусов в 3π/4 радиан?", "options": ["45°", "120°", "135°", "270°"], "answer": 2, "explain": "3/4 от 180° равно 135°."}]},
  {"n": 11, "m": "Ноябрь", "t": "Тригонометрические формулы: сложение и двойной угол", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Для sin(α + β) используй sin α·cos β + cos α·sin β. Для cos(α + β): cos α·cos β − sin α·sin β.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Разложи угол → Подставь → Упрости\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Разложи угол</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Подставь</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Упрости</text></svg></figure><aside class=\"pm-rule\">Формула для второго угла: cos 2α = cos²α − sin²α = 2cos²α − 1.</aside><h3>Пример по шагам</h3><p><strong>Найди sin 75°</strong></p><ol><li>75° = 45° + 30°.</li><li>Подставим значения: (√2/2)(√3/2) + (√2/2)(1/2).</li><li>Ответ: (√6 + √2)/4.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> sin(α + β) не равен sin α + sin β. Для двойного угла sin 2α = 2 sin α cos α.</div><p><a class=\"pm-btn\" href=\"#/t/11/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Если sin α = 3/5 и cos α = 4/5, чему равен sin 2α?", "options": ["24/25", "12/25", "1", "7/25"], "answer": 0, "explain": "2·(3/5)·(4/5) = 24/25."}, {"q": "Чему равен cos 120°?", "options": ["√3/2", "1/2", "−1", "−1/2"], "answer": 3, "explain": "cos 120° = cos²60° − sin²60° = 1/4 − 3/4."}, {"q": "Если cos α = 3/5, найди cos 2α.", "options": ["9/25", "18/25", "−7/25", "7/25"], "answer": 2, "explain": "cos 2α = 2cos²α − 1 = 18/25 − 1."}, {"q": "Чему равен sin(45° − 30°)?", "options": ["(√6 − √2)/4", "1/2", "√2/2", "(√6 + √2)/4"], "answer": 0, "explain": "Подставляем в sin(α − β) = sin α cos β − cos α sin β."}]},
  {"n": 12, "m": "Ноябрь", "t": "Тригонометрические уравнения", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Сначала найди углы на одном обороте. Потом прибавь целое число периодов. У sin и cos период 2π, у tg — π.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Единичная окружность: горизонтальная координата — косинус, вертикальная — синус.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"180\" cy=\"73\" r=\"55\" fill=\"#def0fe\" stroke=\"#3373a0\" stroke-width=\"2\"/><path d=\"M80 73h210M180 12v121M180 73l48-27m0 0v27\" fill=\"none\" stroke=\"#426a83\" stroke-width=\"2\"/><circle cx=\"228\" cy=\"46\" r=\"4\" fill=\"#9d5427\"/><text x=\"265\" y=\"93\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">cos t</text><text x=\"159\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">sin t</text></svg></figure><h3>Пример по шагам</h3><p><strong>Реши sin x = 1/2</strong></p><ol><li>На обороте [0; 2π) подходят π/6 и 5π/6.</li><li>К каждому углу прибавляем 2πk, где k — целое.</li><li>Получаем две серии решений.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Не добавляй 2πk, если условие требует ответы только на заданном промежутке.</div><p><a class=\"pm-btn\" href=\"#/t/12/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Сколько решений у sin x = 0 на [0; 2π)?", "options": ["1", "0", "2", "3"], "answer": 2, "explain": "Подходят 0 и π; точка 2π не входит."}, {"q": "Реши cos x = 1.", "options": ["x = πk", "x = π/2 + 2πk", "x = 2πk", "x = π + 2πk"], "answer": 2, "explain": "Косинус равен 1 справа на окружности, при полных оборотах."}, {"q": "Реши tg x = 1.", "options": ["x = π/4 + 2πk", "x = π/2 + πk", "x = π/4 + πk", "x = πk"], "answer": 2, "explain": "На одном периоде подходит π/4; период тангенса — π."}, {"q": "Сколько решений у cos x = 3/2?", "options": ["Бесконечно много", "2", "0", "1"], "answer": 2, "explain": "Значения косинуса лежат от −1 до 1."}]},
  {"n": 13, "m": "Декабрь", "t": "Системы линейных и нелинейных уравнений", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Решение системы — одна пара чисел, которая подходит для обоих уравнений. Обычно помогает подстановка или сложение.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Подставь → Реши → Проверь пару\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Подставь</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Реши</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Проверь пару</text></svg></figure><h3>Пример по шагам</h3><p><strong>x + y = 7; x − y = 1</strong></p><ol><li>Складываем уравнения: 2x = 8.</li><li>x = 4. Подставляем в первое: y = 3.</li><li>Проверяем второе: 4 − 3 = 1.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Если подстановка дала два значения x, найди y для каждого.</div><p><a class=\"pm-btn\" href=\"#/t/13/practice\">Перейти к практике</a></p>", "tasks": [{"q": "x + y = 9; x − y = 3. Найди (x; y).", "options": ["(9; 3)", "(6; 3)", "(3; 6)", "(6; 6)"], "answer": 1, "explain": "Сложение даёт 2x = 12; x = 6, y = 3."}, {"q": "2x + y = 7; y = x + 1. Найди x.", "options": ["4", "2", "1", "3"], "answer": 1, "explain": "Подстановка даёт 3x + 1 = 7, откуда x = 2."}, {"q": "y = x²; y = 4. Сколько решений у системы?", "options": ["1", "0", "4", "2"], "answer": 3, "explain": "x² = 4, значит x = −2 или 2. Для каждого y = 4."}, {"q": "y = x; x + y² = 6. Найди все значения x.", "options": ["−3 и 2", "−2 и 3", "−3 и −2", "Только 2"], "answer": 0, "explain": "x² + x − 6 = (x + 3)(x − 2) = 0."}]},
  {"n": 14, "m": "Декабрь", "t": "Системы с корнями, степенями, логарифмами и тригонометрией", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Подставь простое уравнение в сложное или введи замену. Затем вернись к исходным переменным и проверь ограничения.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Преобразуй → Подставь → Проверь\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Преобразуй</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Подставь</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Проверь</text></svg></figure><h3>Пример по шагам</h3><p><strong>√(x + y) = 3; x − y = 1</strong></p><ol><li>Из первого следует x + y = 9.</li><li>Складываем с x − y = 1: 2x = 10.</li><li>x = 5, y = 4. Проверка: √9 = 3.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> При замене u = aˣ число u положительно. Для логарифма проверь каждый аргумент.</div><p><a class=\"pm-btn\" href=\"#/t/14/practice\">Перейти к практике</a></p>", "tasks": [{"q": "√(x + y) = 2; x − y = 2. Найди (x; y).", "options": ["(3; 1)", "(1; 3)", "(2; 0)", "(4; 2)"], "answer": 0, "explain": "x + y = 4. Вместе с x − y = 2 получаем (3; 1)."}, {"q": "2ˣ⁺ʸ = 16; x − y = 2. Найди x.", "options": ["1", "4", "2", "3"], "answer": 3, "explain": "x + y = 4. Сложение даёт 2x = 6."}, {"q": "log₂x + log₂y = 3; y = 2. Найди x.", "options": ["6", "4", "2", "8"], "answer": 1, "explain": "log₂x + 1 = 3, значит log₂x = 2 и x = 4."}, {"q": "sin x = 0; y = cos x; 0 ≤ x &lt; 2π. Какие значения принимает y?", "options": ["Только 0", "Только 1", "0 и 1", "−1 и 1"], "answer": 3, "explain": "x = 0 или π; cos 0 = 1, cos π = −1."}]},
  {"n": 15, "m": "Декабрь", "t": "Линейные и квадратные неравенства", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> В линейном неравенстве знак меняется при делении на отрицательное число. У квадратичного сравни знак параболы с нулём.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"x² − 5x + 6: знак между 2 и 3\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"190\" y=\"29\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">x² − 5x + 6: знак между 2 и 3</text><path d=\"M39 77h302m-10-6 10 6-10 6\" fill=\"none\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"125\" cy=\"77\" r=\"6\" fill=\"white\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"77\" r=\"6\" fill=\"white\" stroke=\"#345e7d\" stroke-width=\"2\"/><text x=\"85\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">+</text><text x=\"186\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">−</text><text x=\"301\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">+</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">2</text><text x=\"250\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">3</text></svg></figure><h3>Пример по шагам</h3><p><strong>x² − 5x + 6 &lt; 0</strong></p><ol><li>Разложение: (x − 2)(x − 3).</li><li>Ветви направлены вверх, между корнями выражение отрицательно.</li><li>Ответ: (2; 3).</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> При строгом знаке корни не включаем. При ≤ или ≥ — включаем, если выражение определено.</div><p><a class=\"pm-btn\" href=\"#/t/15/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши −2x &gt; 6.", "options": ["x &gt; 3", "x &lt; −3", "x &gt; −3", "x &lt; 3"], "answer": 1, "explain": "Делим на −2 и меняем знак."}, {"q": "Реши x² − 4 ≤ 0.", "options": ["[0; 2]", "(−2; 2)", "(−∞; −2] ∪ [2; +∞)", "[−2; 2]"], "answer": 3, "explain": "Парабола не выше нуля от −2 до 2, включая корни."}, {"q": "Реши x² + 1 &gt; 0.", "options": ["Нет решений", "x ≥ 0", "Все действительные x", "x &gt; 1"], "answer": 2, "explain": "x² ≥ 0, значит x² + 1 ≥ 1."}, {"q": "Реши (x − 1)(x + 3) &gt; 0.", "options": ["[−3; 1]", "(−∞; 1)", "(−∞; −3) ∪ (1; +∞)", "(−3; 1)"], "answer": 2, "explain": "Два множителя одного знака на внешних промежутках."}]},
  {"n": 16, "m": "Декабрь", "t": "Рациональные неравенства: метод интервалов", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Найди нули числителя и знаменателя. Отметь их на оси. Определи знак выражения между соседними точками.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Дробь: −2 запрещено, 1 входит\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"190\" y=\"29\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Дробь: −2 запрещено, 1 входит</text><path d=\"M39 77h302m-10-6 10 6-10 6\" fill=\"none\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"125\" cy=\"77\" r=\"6\" fill=\"white\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"77\" r=\"6\" fill=\"#345e7d\"/><text x=\"85\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">+</text><text x=\"186\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">−</text><text x=\"301\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">+</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">−2</text><text x=\"250\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">1</text></svg></figure><h3>Пример по шагам</h3><p><strong>(x − 1)/(x + 2) ≥ 0</strong></p><ol><li>Нуль числителя: 1. Запрет знаменателя: −2.</li><li>Знаки слева направо: плюс, минус, плюс.</li><li>Ответ: (−∞; −2) ∪ [1; +∞).</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Нуль знаменателя никогда не включают. После сокращения он тоже остаётся запрещённым.</div><p><a class=\"pm-btn\" href=\"#/t/16/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши (x − 3)/(x + 1) &lt; 0.", "options": ["(−∞; −1)", "[−1; 3]", "(3; +∞)", "(−1; 3)"], "answer": 3, "explain": "Между −1 и 3 числитель отрицателен, знаменатель положителен."}, {"q": "Реши 1/(x − 2) &gt; 0.", "options": ["x ≠ 2", "x ≥ 2", "x &lt; 2", "x &gt; 2"], "answer": 3, "explain": "Числитель положителен. Нужен положительный знаменатель."}, {"q": "Реши (x + 1)/(x − 4) ≤ 0.", "options": ["(−∞; −1]", "[−1; 4)", "[−1; 4]", "(−1; 4]"], "answer": 1, "explain": "От −1 до 4 дробь отрицательна, при −1 равна нулю, при 4 не определена."}, {"q": "Упрости (x² − 1)/(x − 1) и реши ≥ 0.", "options": ["[−1; +∞)", "[−1; 1) ∪ (1; +∞)", "(−∞; 1)", "(1; +∞)"], "answer": 1, "explain": "При x ≠ 1 дробь равна x + 1. Решаем x + 1 ≥ 0 и убираем 1."}, {"q": "Рубежный тест: упрости √98.", "options": ["√49", "7√2", "14√2", "49√2"], "answer": 1, "explain": "98 = 49·2."}, {"q": "Рубежный тест: при каком x дробь 1/(x² − 9) не определена?", "options": ["Только 3", "−3 и 3", "−9 и 9", "Только −3"], "answer": 1, "explain": "Решаем x² − 9 = 0."}, {"q": "Рубежный тест: реши 3ˣ = 1/27.", "options": ["3", "−3", "0", "−9"], "answer": 1, "explain": "1/27 = 3⁻³."}, {"q": "Рубежный тест: реши log₃(x − 1) = 2.", "options": ["8", "7", "9", "10"], "answer": 3, "explain": "x − 1 = 9, значит x = 10."}, {"q": "Рубежный тест: найди число решений sin x = 1 на [0; 2π).", "options": ["3", "1", "0", "2"], "answer": 1, "explain": "Только π/2."}, {"q": "Рубежный тест: реши x + y = 10; x − y = 4.", "options": ["(7; 3)", "(8; 2)", "(6; 4)", "(3; 7)"], "answer": 0, "explain": "Из сложения получаем 2x = 14."}]},
  {"n": 17, "m": "Январь", "t": "Показательные неравенства", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Если a &gt; 1, функция aˣ возрастает и знак сохраняется. Если 0 &lt; a &lt; 1, она убывает и знак меняется.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Основание → Знак → Ответ\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Основание</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Знак</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Ответ</text></svg></figure><h3>Пример по шагам</h3><p><strong>(1/2)ˣ &gt; (1/2)³</strong></p><ol><li>Основание 1/2 меньше 1.</li><li>Большему значению соответствует меньший показатель.</li><li>Ответ: x &lt; 3.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Проверь основание прежде, чем сравнивать показатели.</div><p><a class=\"pm-btn\" href=\"#/t/17/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши 2ˣ &gt; 8.", "options": ["x &gt; 3", "x &gt; 8", "x &lt; 3", "x ≥ 3"], "answer": 0, "explain": "8 = 2³. Основание 2 &gt; 1."}, {"q": "Реши (1/3)ˣ ≥ 1/9.", "options": ["x ≤ 2", "x ≤ −2", "x ≥ 2", "x &gt; 2"], "answer": 0, "explain": "1/9 = (1/3)²; функция убывает."}, {"q": "Реши 4ˣ &lt; 2.", "options": ["x &gt; 1/2", "x &lt; 1/2", "x &lt; 2", "x ≤ 1/2"], "answer": 1, "explain": "4ˣ = 2²ˣ. Поэтому 2x &lt; 1."}, {"q": "Реши 3ˣ⁻¹ ≤ 1.", "options": ["x ≤ 0", "x ≤ 1", "x &lt; 1", "x ≥ 1"], "answer": 1, "explain": "1 = 3⁰. Отсюда x − 1 ≤ 0."}]},
  {"n": 18, "m": "Январь", "t": "Логарифмические неравенства", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Аргумент логарифма должен быть положителен. Сравнивай аргументы с тем же знаком при a &gt; 1 и с обратным при 0 &lt; a &lt; 1.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"ОДЗ → Сравни → Пересечение\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">ОДЗ</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Сравни</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Пересечение</text></svg></figure><h3>Пример по шагам</h3><p><strong>log₁⁄₂(x − 1) &gt; 0</strong></p><ol><li>ОДЗ: x &gt; 1. Ноль — это log₁⁄₂1.</li><li>Основание меньше 1, поэтому x − 1 &lt; 1.</li><li>Пересечение условий: 1 &lt; x &lt; 2.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Сравнение аргументов не заменяет проверку ОДЗ.</div><p><a class=\"pm-btn\" href=\"#/t/18/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши log₂x ≥ 3.", "options": ["x ≥ 8", "x &gt; 8", "0 &lt; x ≤ 8", "x ≥ 3"], "answer": 0, "explain": "2³ = 8; функция возрастает."}, {"q": "Реши log₃(x − 2) &lt; 1.", "options": ["x &lt; 5", "x &gt; 5", "2 ≤ x &lt; 5", "2 &lt; x &lt; 5"], "answer": 3, "explain": "ОДЗ x &gt; 2, одновременно x − 2 &lt; 3."}, {"q": "Реши log₁⁄₂x ≥ 1.", "options": ["0 ≤ x ≤ 1/2", "x ≥ 1/2", "0 &lt; x ≤ 1/2", "x ≥ 2"], "answer": 2, "explain": "ОДЗ x &gt; 0. Знак при сравнении аргументов меняется."}, {"q": "Реши log₅(x + 1) ≥ log₅(2x − 1).", "options": ["1/2 ≤ x ≤ 2", "x ≤ 2", "1/2 &lt; x ≤ 2", "x ≥ 2"], "answer": 2, "explain": "ОДЗ x &gt; 1/2; сравнение даёт x + 1 ≥ 2x − 1, то есть x ≤ 2."}]},
  {"n": 19, "m": "Январь", "t": "Иррациональные и тригонометрические неравенства", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> При корне сначала задай область определения. Для тригонометрии выдели нужную дугу окружности и проверь концы.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Единичная окружность: горизонтальная координата — косинус, вертикальная — синус.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"180\" cy=\"73\" r=\"55\" fill=\"#def0fe\" stroke=\"#3373a0\" stroke-width=\"2\"/><path d=\"M80 73h210M180 12v121M180 73l48-27m0 0v27\" fill=\"none\" stroke=\"#426a83\" stroke-width=\"2\"/><circle cx=\"228\" cy=\"46\" r=\"4\" fill=\"#9d5427\"/><text x=\"265\" y=\"93\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">cos t</text><text x=\"159\" y=\"30\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">sin t</text></svg></figure><h3>Пример по шагам</h3><p><strong>Реши √(x + 1) &lt; 3</strong></p><ol><li>Должно быть x ≥ −1.</li><li>Обе стороны неотрицательны: x + 1 &lt; 9, то есть x &lt; 8.</li><li>Ответ: [−1; 8).</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Из √A &gt; B нельзя сразу сделать A &gt; B², если B отрицательно.</div><p><a class=\"pm-btn\" href=\"#/t/19/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Реши √(x − 2) ≤ 4.", "options": ["(−∞; 18]", "[2; 18]", "[2; 16]", "(2; 18]"], "answer": 1, "explain": "x ≥ 2 и x − 2 ≤ 16."}, {"q": "На [0; 2π) где sin x &gt; 0?", "options": ["(π; 2π)", "(0; π)", "(−π/2; π/2)", "[0; π]"], "answer": 1, "explain": "Синус — вертикальная координата. Она положительна в верхней полуплоскости."}, {"q": "Где определён √(5 − x)?", "options": ["x &gt; 5", "x ≤ 5", "x &lt; 5", "x ≥ 5"], "answer": 1, "explain": "5 − x ≥ 0."}, {"q": "На [0; π] где cos x ≥ 1/2?", "options": ["[π/3; π]", "(0; π/3)", "[0; π/3]", "[0; π/2]"], "answer": 2, "explain": "На [0; π] косинус убывает, cos π/3 = 1/2."}]},
  {"n": 20, "m": "Февраль", "t": "Системы неравенств", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> В системе должны выполняться все условия одновременно. Реши каждое отдельно, затем найди пересечение.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Общая часть: от 1 (не входит) до 3 (входит)\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"190\" y=\"29\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Общая часть: от 1 (не входит) до 3 (входит)</text><path d=\"M39 77h302m-10-6 10 6-10 6\" fill=\"none\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"125\" cy=\"77\" r=\"6\" fill=\"white\" stroke=\"#345e7d\" stroke-width=\"2\"/><circle cx=\"250\" cy=\"77\" r=\"6\" fill=\"#345e7d\"/><text x=\"85\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">·</text><text x=\"186\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">✓</text><text x=\"301\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">·</text><text x=\"125\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">1</text><text x=\"250\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">3</text></svg></figure><h3>Пример по шагам</h3><p><strong>x² − 9 ≤ 0; x &gt; 1</strong></p><ol><li>Первое условие: −3 ≤ x ≤ 3.</li><li>Второе оставляет числа строго больше 1.</li><li>Ответ: (1; 3].</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Пересечение не заменяй объединением: точка должна подходить для каждого условия.</div><p><a class=\"pm-btn\" href=\"#/t/20/practice\">Перейти к практике</a></p>", "tasks": [{"q": "x ≥ −2 и x &lt; 4. Найди пересечение.", "options": ["(−∞; 4)", "(−2; 4]", "[−2; 4)", "[−2; +∞)"], "answer": 2, "explain": "Общие числа от −2 включительно до 4 не включительно."}, {"q": "x² ≤ 4 и x &gt; 0. Найди пересечение.", "options": ["[−2; 2]", "(0; 2]", "[0; 2]", "(2; +∞)"], "answer": 1, "explain": "Первое даёт [−2; 2], второе исключает ноль и отрицательные."}, {"q": "x &lt; 1 и x ≥ 2. Найди пересечение.", "options": ["(−∞; 1)", "Пустое множество", "[1; 2]", "Все x"], "answer": 1, "explain": "Нет числа меньше 1 и одновременно не меньше 2."}, {"q": "2ˣ ≥ 4 и log₂x &lt; 2. Найди пересечение.", "options": ["[2; +∞)", "(0; 4)", "(2; 4]", "[2; 4)"], "answer": 3, "explain": "Первое: x ≥ 2. Второе: 0 &lt; x &lt; 4."}]},
  {"n": 21, "m": "Февраль", "t": "Арифметическая прогрессия", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> В арифметической прогрессии к каждому члену прибавляют одно число d. aₙ = a₁ + (n − 1)d.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Член 1 → Равный шаг → Член n\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Член 1</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Равный шаг</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Член n</text></svg></figure><aside class=\"pm-rule\">Геометрическая разминка: если длины сторон увеличили в 2 раза, площади похожих фигур увеличатся в 4 раза.</aside><h3>Пример по шагам</h3><p><strong>a₁ = 5, d = 3. Найди a₆ и S₆</strong></p><ol><li>Между первым и шестым членами 5 шагов: a₆ = 20.</li><li>Среднее первого и последнего равно (5 + 20)/2.</li><li>S₆ = 6·(5 + 20)/2 = 75.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Шагов на один меньше, чем номер члена.</div><p><a class=\"pm-btn\" href=\"#/t/21/practice\">Перейти к практике</a></p>", "tasks": [{"q": "a₁ = 4, d = 2. Найди a₆.", "options": ["12", "16", "8", "14"], "answer": 3, "explain": "a₆ = 4 + 5·2 = 14."}, {"q": "Последовательность 11, 8, 5, 2. Найди d.", "options": ["3", "−8", "2", "−3"], "answer": 3, "explain": "Разность соседних членов 8 − 11 = −3."}, {"q": "Найди сумму 1 + 2 + … + 20.", "options": ["210", "190", "420", "200"], "answer": 0, "explain": "S₂₀ = 20·(1 + 20)/2 = 210."}, {"q": "В прогрессии a₃ = 8, a₇ = 20. Найди d.", "options": ["3", "4", "12", "2"], "answer": 0, "explain": "Разность между a₇ и a₃ равна 4d, значит d = 12/4."}]},
  {"n": 22, "m": "Февраль", "t": "Геометрическая прогрессия", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> В геометрической прогрессии каждый следующий член получают умножением на q. bₙ = b₁·qⁿ⁻¹.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Член 1 → Умножение → Член n\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Член 1</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Умножение</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Член n</text></svg></figure><h3>Пример по шагам</h3><p><strong>b₁ = 3, q = 2. Найди S₄</strong></p><ol><li>Члены: 3, 6, 12, 24.</li><li>Складываем: 45.</li><li>Или S₄ = b₁(q⁴ − 1)/(q − 1) = 3·15 = 45.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Формулу суммы с q − 1 в знаменателе не используют при q = 1.</div><p><a class=\"pm-btn\" href=\"#/t/22/practice\">Перейти к практике</a></p>", "tasks": [{"q": "b₁ = 2, q = 3. Найди b₄.", "options": ["24", "54", "81", "18"], "answer": 1, "explain": "b₄ = 2·3³ = 54."}, {"q": "Найди q у прогрессии 16, 8, 4, 2.", "options": ["−2", "1/4", "1/2", "2"], "answer": 2, "explain": "Делим второй член на первый: 8/16 = 1/2."}, {"q": "Найди сумму 2 + 6 + 18 + 54.", "options": ["80", "72", "81", "78"], "answer": 0, "explain": "Складываем четыре члена: 80."}, {"q": "Найди сумму 12 + 6 + 3 + … до бесконечности.", "options": ["18", "21", "12", "24"], "answer": 3, "explain": "При |q| &lt; 1 сумма равна b₁/(1 − q) = 12/(1 − 1/2) = 24."}]},
  {"n": 23, "m": "Февраль", "t": "Функции: область определения, свойства, графики", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Область определения — допустимые x. Чтобы найти нули функции, ищи f(x) = 0; это пересечения с осью x.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Допустимые x → График → Нули\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Допустимые x</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">График</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Нули</text></svg></figure><aside class=\"pm-rule\">Чётность: сравни f(−x) с f(x). Если они равны на симметричной области, график симметричен относительно оси y.</aside><h3>Пример по шагам</h3><p><strong>Из y = x² получи y = (x − 2)² + 1</strong></p><ol><li>Сдвиг на 2 вправо: вместо x записали x − 2.</li><li>Сдвиг на 1 вверх: прибавили 1.</li><li>Вершина теперь (2; 1). Нулей у графика нет.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Знак внутри скобок у сдвига по горизонтали противоположен направлению.</div><p><a class=\"pm-btn\" href=\"#/t/23/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Область определения f(x) = 1/(x − 4).", "options": ["x &gt; 4", "Все x, кроме 4", "x ≥ 4", "Все x"], "answer": 1, "explain": "При x = 4 знаменатель нулевой."}, {"q": "Найди вершину y = (x + 3)² − 2.", "options": ["(3; −2)", "(3; 2)", "(−3; 2)", "(−3; −2)"], "answer": 3, "explain": "Квадрат равен нулю при x = −3; тогда y = −2."}, {"q": "При каком x функция f(x) = 5 − x равна нулю?", "options": ["−5", "1", "5", "0"], "answer": 2, "explain": "5 − x = 0, значит x = 5."}, {"q": "Какая функция чётная?", "options": ["f(x) = 2x", "f(x) = x³", "f(x) = x² + 1", "f(x) = x + 1"], "answer": 2, "explain": "У чётной функции f(−x) = f(x). Для x² + 1 это выполняется."}]},
  {"n": 24, "m": "Март", "t": "Производная: правила вычисления", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Производная показывает мгновенную скорость изменения. Для xⁿ: (xⁿ)′ = n·xⁿ⁻¹. Константа имеет производную 0.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Касательная к параболе y = x² в точке (2; 4).\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M38 120h300M70 135V12\" stroke=\"#66869a\" stroke-width=\"2\"/><polyline fill=\"none\" stroke=\"#2b6a9e\" stroke-width=\"3\" points=\"70.0,120.0 73.3,120.0 76.7,119.8 80.0,119.6 83.3,119.3 86.7,119.0 90.0,118.5 93.3,118.0 96.7,117.3 100.0,116.6 103.3,115.8 106.7,115.0 110.0,114.0 113.3,113.0 116.7,111.8 120.0,110.6 123.3,109.3 126.7,108.0 130.0,106.5 133.3,105.0 136.7,103.3 140.0,101.6 143.3,99.8 146.7,98.0 150.0,96.0 153.3,94.0 156.7,91.8 160.0,89.6 163.3,87.3 166.7,85.0 170.0,82.5 173.3,80.0 176.7,77.3 180.0,74.6 183.3,71.8 186.7,69.0 190.0,66.0 193.3,63.0 196.7,59.8 200.0,56.6 203.3,53.3 206.7,50.0 210.0,46.5 213.3,43.0 216.7,39.3 220.0,35.6 223.3,31.8 226.7,28.0 230.0,24.0\"/><path d=\"M90 132 222 52.8\" stroke=\"#a85921\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"96\" r=\"4\" fill=\"#a85921\"/><text x=\"261\" y=\"64\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">касательная</text><text x=\"160\" y=\"120\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">(2; 4)</text></svg></figure><aside class=\"pm-rule\">Для произведения (uv)′ = u′v + uv′. Производная sin x равна cos x. Для 1/x запиши x⁻¹.</aside><h3>Пример по шагам</h3><p><strong>Найди производную f(x) = 3x³ − 2x + 7</strong></p><ol><li>Производная 3x³ равна 9x².</li><li>Производная −2x равна −2, у числа 7 она нулевая.</li><li>Ответ: f′(x) = 9x² − 2.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Для сложной функции умножь на производную внутренней: [(2x + 1)³]′ = 6(2x + 1)².</div><p><a class=\"pm-btn\" href=\"#/t/24/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Найди (x⁴)′.", "options": ["x³", "4x⁴", "4x³", "x⁵/5"], "answer": 2, "explain": "Показатель 4 становится множителем, степень уменьшается до 3."}, {"q": "Найди производную 5x² − 3x + 2.", "options": ["10x − 3", "10x + 2", "10x", "5x − 3"], "answer": 0, "explain": "Берём производную каждого слагаемого."}, {"q": "Найди [(3x − 1)²]′.", "options": ["6x − 2", "9x − 1", "2(3x − 1)", "6(3x − 1)"], "answer": 3, "explain": "Производная внешнего квадрата 2(3x − 1), внутренней функции — 3."}, {"q": "Найди [x·sin x]′.", "options": ["sin x − x cos x", "sin x + x cos x", "cos x", "x cos x"], "answer": 1, "explain": "По правилу произведения: (x)′sin x + x(sin x)′."}, {"q": "Найди производную 1/x при x ≠ 0.", "options": ["ln x", "−1/x²", "−1/x", "1/x²"], "answer": 1, "explain": "1/x = x⁻¹. По формуле степени получаем −x⁻²."}]},
  {"n": 25, "m": "Март", "t": "Касательная к графику", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Наклон касательной в x₀ равен f′(x₀). Уравнение: y = f(x₀) + f′(x₀)(x − x₀).</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Касательная к параболе y = x² в точке (2; 4).\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M38 120h300M70 135V12\" stroke=\"#66869a\" stroke-width=\"2\"/><polyline fill=\"none\" stroke=\"#2b6a9e\" stroke-width=\"3\" points=\"70.0,120.0 73.3,120.0 76.7,119.8 80.0,119.6 83.3,119.3 86.7,119.0 90.0,118.5 93.3,118.0 96.7,117.3 100.0,116.6 103.3,115.8 106.7,115.0 110.0,114.0 113.3,113.0 116.7,111.8 120.0,110.6 123.3,109.3 126.7,108.0 130.0,106.5 133.3,105.0 136.7,103.3 140.0,101.6 143.3,99.8 146.7,98.0 150.0,96.0 153.3,94.0 156.7,91.8 160.0,89.6 163.3,87.3 166.7,85.0 170.0,82.5 173.3,80.0 176.7,77.3 180.0,74.6 183.3,71.8 186.7,69.0 190.0,66.0 193.3,63.0 196.7,59.8 200.0,56.6 203.3,53.3 206.7,50.0 210.0,46.5 213.3,43.0 216.7,39.3 220.0,35.6 223.3,31.8 226.7,28.0 230.0,24.0\"/><path d=\"M90 132 222 52.8\" stroke=\"#a85921\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"96\" r=\"4\" fill=\"#a85921\"/><text x=\"261\" y=\"64\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">касательная</text><text x=\"160\" y=\"120\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">(2; 4)</text></svg></figure><h3>Пример по шагам</h3><p><strong>Касательная к y = x² при x₀ = 2</strong></p><ol><li>Точка касания (2; 4).</li><li>f′(x) = 2x, наклон f′(2) = 4.</li><li>y = 4 + 4(x − 2) = 4x − 4.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Не путай высоту f(x₀) и наклон f′(x₀).</div><p><a class=\"pm-btn\" href=\"#/t/25/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Каков наклон касательной к y = x³ при x = 2?", "options": ["8", "4", "6", "12"], "answer": 3, "explain": "f′(2) = 3·2² = 12."}, {"q": "Касательная к y = x² при x = 0.", "options": ["y = 0", "x = 0", "y = x", "y = 2x"], "answer": 0, "explain": "Точка (0;0), производная 0: касательная горизонтальна."}, {"q": "Касательная к y = 2x² при x = 1.", "options": ["y = x + 1", "y = 4x + 2", "y = 4x − 2", "y = 2x"], "answer": 2, "explain": "f(1) = 2, f′(1) = 4. y = 2 + 4(x − 1)."}, {"q": "Касательная проходит через (1; 3), наклон равен −2. Запиши уравнение.", "options": ["y = −2x − 5", "y = −2x + 3", "y = −2x + 5", "y = 2x + 1"], "answer": 2, "explain": "y − 3 = −2(x − 1)."}]},
  {"n": 26, "m": "Март", "t": "Монотонность, экстремумы и значения на отрезке", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Найди f′. Где f′ &gt; 0, функция возрастает; где f′ &lt; 0, убывает. Для максимума и минимума на отрезке сравни значения в критических точках и на концах.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"График x² − 4x сначала убывает, затем возрастает; минимум при x = 2.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M52 90h279M90 130V12\" stroke=\"#658395\" stroke-width=\"2\"/><polyline fill=\"none\" stroke=\"#2b6a9e\" stroke-width=\"3\" points=\"90.0,90.0 94.0,92.3 98.0,94.6 102.0,96.7 106.0,98.6 110.0,100.5 114.0,102.2 118.0,103.9 122.0,105.4 126.0,106.7 130.0,108.0 134.0,109.1 138.0,110.2 142.0,111.1 146.0,111.8 150.0,112.5 154.0,113.0 158.0,113.5 162.0,113.8 166.0,113.9 170.0,114.0 174.0,113.9 178.0,113.8 182.0,113.5 186.0,113.0 190.0,112.5 194.0,111.8 198.0,111.1 202.0,110.2 206.0,109.1 210.0,108.0 214.0,106.7 218.0,105.4 222.0,103.9 226.0,102.2 230.0,100.5 234.0,98.6 238.0,96.7 242.0,94.6 246.0,92.3 250.0,90.0 254.0,87.5 258.0,85.0 262.0,82.3 266.0,79.4 270.0,76.5 274.0,73.4 278.0,70.3 282.0,67.0 286.0,63.5 290.0,60.0\"/><circle cx=\"170\" cy=\"114\" r=\"4\" fill=\"#9b5620\"/><text x=\"170\" y=\"138\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">x = 2</text><text x=\"236\" y=\"48\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">минимум −4</text></svg></figure><h3>Пример по шагам</h3><p><strong>Найди минимум f(x) = x² − 4x на [0; 5]</strong></p><ol><li>f′(x) = 2x − 4. Критическая точка x = 2.</li><li>f(0) = 0, f(2) = −4, f(5) = 5.</li><li>Минимум равен −4.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Равенство f′ = 0 само по себе не доказывает экстремум: проверь смену знака.</div><p><a class=\"pm-btn\" href=\"#/t/26/practice\">Перейти к практике</a></p>", "tasks": [{"q": "На каком промежутке возрастает x² при x &gt; 0?", "options": ["Ни на каком", "Только (0; 1)", "(0; +∞)", "(−∞; 0)"], "answer": 2, "explain": "Производная 2x положительна при x &gt; 0."}, {"q": "Производная меняет знак с плюса на минус. Что в точке смены?", "options": ["Нуль функции", "Нет экстремума", "Локальный минимум", "Локальный максимум"], "answer": 3, "explain": "До точки функция возрастает, после — убывает."}, {"q": "Найди наибольшее значение x² на [−2; 1].", "options": ["4", "0", "2", "1"], "answer": 0, "explain": "Сравниваем значения 4, 0 и 1 в концах и в критической точке."}, {"q": "Где минимум функции f(x) = (x − 3)² + 5?", "options": ["x = 0", "x = −3", "x = 5", "x = 3"], "answer": 3, "explain": "Квадрат неотрицателен и равен нулю именно при x = 3."}]},
  {"n": 27, "m": "Март", "t": "Первообразная, интеграл и площадь", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Первообразная F имеет производную f. Определённый интеграл от a до b равен F(b) − F(a). Если график ниже оси x, площадь учитывай со знаком плюс.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Площадь треугольника под графиком y = 2x от нуля до трёх.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M70 120h247M85 132V12\" stroke=\"#4d6b83\" fill=\"none\" stroke-width=\"2\"/><path d=\"M85 120l159-91v91z\" fill=\"#c5e9da\" stroke=\"#328271\" stroke-width=\"2\"/><text x=\"244\" y=\"140\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">3</text><text x=\"263\" y=\"24\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">y = 2x</text></svg></figure><h3>Пример по шагам</h3><p><strong>Найди площадь под y = 2x на [0; 3]</strong></p><ol><li>График не ниже оси x.</li><li>Первообразная — F(x) = x².</li><li>Площадь: F(3) − F(0) = 9.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Интеграл ниже оси отрицательный; геометрическая площадь — неотрицательная.</div><p><a class=\"pm-btn\" href=\"#/t/27/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Найди первообразную x².", "options": ["x²/2 + C", "x³ + C", "2x + C", "x³/3 + C"], "answer": 3, "explain": "Производная x³/3 равна x²."}, {"q": "Чему равен интеграл 2x от 1 до 3?", "options": ["9", "6", "4", "8"], "answer": 3, "explain": "F(x) = x²; F(3) − F(1) = 9 − 1."}, {"q": "Какова площадь между y = −2 и осью x от 0 до 3?", "options": ["2", "3", "6", "−6"], "answer": 2, "explain": "Прямоугольник шириной 3 и высотой 2."}, {"q": "Чему равен интеграл x от −2 до 2?", "options": ["2", "0", "4", "8"], "answer": 1, "explain": "F(x) = x²/2; значения в концах одинаковы. Площади с разными знаками компенсируются."}]},
  {"n": 28, "m": "Апрель", "t": "Моделирование: движение, работа, проценты и смеси", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Выбери неизвестное, запиши единицы и составь равенство. Сравнивай одинаковые величины: километры с километрами, массы вещества с массами.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Единицы → Модель → Ответ\" viewBox=\"0 0 380 78\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d7ecfb\"/><text x=\"61\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Единицы</text><path d=\"M120 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"131\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#d9f0e8\"/><text x=\"187\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Модель</text><path d=\"M246 40h10\" stroke=\"#6d8fa7\" stroke-width=\"2\"/><rect x=\"257\" y=\"18\" width=\"112\" height=\"44\" rx=\"10\" fill=\"#fbecc3\"/><text x=\"313\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Ответ</text></svg></figure><h3>Пример по шагам</h3><p><strong>К 200 г 30%-го раствора долили воду. Сколько воды нужно для 20%-го раствора?</strong></p><ol><li>Масса вещества: 200·0,30 = 60 г. Она не меняется.</li><li>Новая масса смеси: 60/0,20 = 300 г.</li><li>Долили 300 − 200 = 100 г.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> При совместной работе складывают производительности, а не часы.</div><p><a class=\"pm-btn\" href=\"#/t/28/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Авто проехало 120 км за 1,5 ч. Найди среднюю скорость.", "options": ["60 км/ч", "80 км/ч", "90 км/ч", "180 км/ч"], "answer": 1, "explain": "120/1,5 = 80."}, {"q": "Первый выполняет работу за 6 ч, второй — за 3 ч. За сколько выполнят вместе?", "options": ["2 ч", "9 ч", "4,5 ч", "3 ч"], "answer": 0, "explain": "1/6 + 1/3 = 1/2 работы за час."}, {"q": "После скидки 20% товар стоит 4800 тг. Найди исходную цену.", "options": ["9600 тг", "5760 тг", "6000 тг", "3840 тг"], "answer": 2, "explain": "4800 тг — это 80%; 4800/0,8 = 6000."}, {"q": "Смешали 200 г 10%-го раствора и 100 г 40%-го. Найди концентрацию.", "options": ["15%", "20%", "30%", "25%"], "answer": 1, "explain": "Масса вещества 20 + 40 = 60 г из 300 г, то есть 20%."}]},
  {"n": 29, "m": "Апрель", "t": "Планиметрия: треугольники и четырёхугольники", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Сделай чертёж и отметь известные длины. В прямоугольном треугольнике c² = a² + b²; у подобных фигур площади относятся как квадрат коэффициента подобия.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Прямоугольный треугольник: основание, высота и гипотенуза.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M83 114h185L83 31z\" fill=\"#d5edfd\" stroke=\"#3676a0\" stroke-width=\"2\"/><path d=\"M83 99h15v15\" stroke=\"#3676a0\" fill=\"none\"/><text x=\"173\" y=\"137\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">основание</text><text x=\"44\" y=\"75\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">высота</text><text x=\"216\" y=\"51\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">гипотенуза</text></svg></figure><aside class=\"pm-rule\">Если известны две стороны и угол γ между ними: c² = a² + b² − 2ab·cos γ. Площадь трапеции — полусумма оснований, умноженная на высоту.</aside><h3>Пример по шагам</h3><p><strong>Треугольники подобны, стороны второго в 3 раза больше. Площадь первого 12</strong></p><ol><li>Коэффициент подобия 3.</li><li>Площадь меняется в 3² = 9 раз.</li><li>Площадь второго: 12·9 = 108.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Не подставляй боковую сторону вместо высоты.</div><p><a class=\"pm-btn\" href=\"#/t/29/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Катеты 5 и 12. Найди гипотенузу.", "options": ["13", "17", "√17", "15"], "answer": 0, "explain": "√(25 + 144) = 13."}, {"q": "Основания трапеции 5 и 9, высота 4. Найди площадь.", "options": ["28", "56", "36", "14"], "answer": 0, "explain": "Площадь (5 + 9)·4/2 = 28."}, {"q": "В подобных треугольниках отношение длин 2 : 3. Как относятся площади?", "options": ["4 : 9", "8 : 27", "3 : 2", "2 : 3"], "answer": 0, "explain": "Возводим отношения длин в квадрат."}, {"q": "Площадь параллелограмма 48, основание 8. Найди высоту к нему.", "options": ["3", "8", "12", "6"], "answer": 3, "explain": "S = a·h, значит h = 48/8."}, {"q": "Две стороны 5 и 7, угол между ними 60°. Найди третью сторону.", "options": ["√74", "12", "√39", "2"], "answer": 2, "explain": "По теореме косинусов c² = 25 + 49 − 2·5·7·(1/2) = 39."}]},
  {"n": 30, "m": "Апрель", "t": "Планиметрия: окружность, площади и векторы на плоскости", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Длина окружности 2πr, площадь круга πr². Для вектора AB вычитай координаты начала A из координат конца B.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Вектор идёт из A в B. По горизонтали и вертикали видны изменения координат.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M49 124h274M70 136V13\" stroke=\"#688497\" stroke-width=\"2\"/><path d=\"M122 98h126V38\" fill=\"none\" stroke=\"#7c9eba\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/><path d=\"M122 98 248 38m-17 3 17-3-10 13\" stroke=\"#126c62\" stroke-width=\"3\" fill=\"none\"/><text x=\"107\" y=\"99\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">A</text><text x=\"262\" y=\"34\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">B</text><text x=\"180\" y=\"119\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Δx</text><text x=\"271\" y=\"71\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">Δy</text></svg></figure><h3>Пример по шагам</h3><p><strong>Найди координаты вектора AB, если A(1; −2), B(4; 2)</strong></p><ol><li>По x: 4 − 1 = 3.</li><li>По y: 2 − (−2) = 4.</li><li>AB = (3; 4), его длина √(3² + 4²) = 5.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> r — радиус, а не диаметр. Для площади сектора сначала найди долю α/360°.</div><p><a class=\"pm-btn\" href=\"#/t/30/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Длина окружности равна 10π. Найди радиус.", "options": ["2", "10", "25", "5"], "answer": 3, "explain": "2πr = 10π, значит r = 5."}, {"q": "Найди площадь сектора 90° в круге радиуса 4.", "options": ["8π", "2π", "16π", "4π"], "answer": 3, "explain": "Четверть от π·4² равна 4π."}, {"q": "A(−1; 2), B(3; 5). Найди координаты AB.", "options": ["(4; 3)", "(−4; −3)", "(3; 4)", "(2; 7)"], "answer": 0, "explain": "Из координат конца вычитаем начало: (3 + 1; 5 − 2)."}, {"q": "Точку (2; −3) отразили относительно оси x. Найди образ.", "options": ["(3; 2)", "(2; 3)", "(−2; −3)", "(−2; 3)"], "answer": 1, "explain": "При отражении относительно оси x меняется только знак y."}, {"q": "Перенеси точку (−2; 4) на вектор (5; −3).", "options": ["(7; −1)", "(−7; 7)", "(−3; 5)", "(3; 1)"], "answer": 3, "explain": "Прибавляем компоненты вектора: (−2 + 5; 4 − 3)."}]},
  {"n": 31, "m": "Апрель", "t": "Стереометрия, координаты и векторы", "lecture": "<p class=\"pm-rule\"><strong>Главная мысль.</strong> Держи отдельно три темы: объём, площадь поверхности и расстояние в пространстве. Если отрезок не лежит на чертеже в одной плоскости, сначала найди его проекцию.</p><figure class=\"pm-figure\"><svg role=\"img\" aria-label=\"Параллелепипед. Пунктиром показана диагональ основания, цветной линией — пространственная диагональ.\" viewBox=\"0 0 380 145\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M80 129h135l64-35H144zM80 58h135l64-35H144zM80 129V58M215 129V58M279 94V23M144 94V23\" stroke=\"#426c90\" stroke-width=\"2\" fill=\"none\"/><path d=\"M80 129 279 94\" stroke=\"#a96d25\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/><path d=\"M80 129 279 23\" stroke=\"#08785c\" stroke-width=\"3\"/><text x=\"319\" y=\"65\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\">высота</text></svg></figure><section><h3>Тела и их размеры</h3><p>У призмы и цилиндра объём равен площади основания, умноженной на высоту. У пирамиды и конуса — треть этого произведения. Если на рисунке дана наклонная сторона, не подставляй её вместо перпендикулярной высоты.</p></section>\n<section><h3>Угол и расстояние</h3><p>Угол между прямой и плоскостью ищут между прямой и её проекцией. Диагональ основания может стать катетом второго треугольника.</p></section>\n<section><h3>Координаты, векторы и отражения</h3><p>Координаты AB — это B − A, покомпонентно. Скалярное произведение: умножь соответствующие координаты и сложи. Для ненулевых векторов нулевое произведение означает перпендикулярность. При отражении относительно плоскости xy меняется знак только координаты z.</p></section><h3>Пример по шагам</h3><p><strong>У прямоугольного параллелепипеда рёбра 3, 4 и 12. Найди диагональ</strong></p><ol><li>Диагональ основания: √(3² + 4²) = 5.</li><li>Пространственная диагональ и высота образуют второй прямоугольный треугольник.</li><li>Диагональ: √(5² + 12²) = 13.</li></ol><div class=\"pm-rule\"><strong>Не перепутай.</strong> Квадратные единицы — площадь; кубические — объём. Вектор в пространстве имеет три координаты.</div><p><a class=\"pm-btn\" href=\"#/t/31/practice\">Перейти к практике</a></p>", "tasks": [{"q": "Найди объём прямоугольной коробки 2 × 3 × 5.", "options": ["10", "62", "30", "31"], "answer": 2, "explain": "Умножаем три измерения: 2·3·5 = 30."}, {"q": "Найди площадь полной поверхности куба с ребром 4.", "options": ["64", "32", "48", "96"], "answer": 3, "explain": "У куба 6 граней по 4² = 16."}, {"q": "Найди расстояние от O(0;0;0) до A(2;3;6).", "options": ["√11", "7", "11", "49"], "answer": 1, "explain": "√(2² + 3² + 6²) = √49 = 7."}, {"q": "Найди скалярное произведение (1;2;3) и (2;−1;4).", "options": ["0", "16", "14", "12"], "answer": 3, "explain": "1·2 + 2·(−1) + 3·4 = 12."}, {"q": "Отрази точку (2; −4; 7) относительно плоскости xy.", "options": ["(2; −4; −7)", "(2; 4; 7)", "(−2; 4; 7)", "(−2; −4; −7)"], "answer": 0, "explain": "Только перпендикулярная координата z меняет знак."}]},

ён."}, {"q": "Что проверить первым после возведения уравнения с корнем в квадрат?", "options": ["Можно ли всегда отбросить отрицательные x", "Нет ли дробей в вычислениях", "Подходит ли корень в исходное уравнение", "Нужно ли поменять порядок слагаемых"], "answer": 2, "explain": "Возведение в квадрат может добавить посторонний корень."}, {"q": "На [0; 3] максимальное значение f(x) ищем…", "options": ["Только в правом конце", "Только при f(x) = 0", "Только из f′(x) = 0", "В концах и допустимых критических точках"], "answer": 3, "explain": "Сравнение значений во всех кандидатах защищает от пропуска максимума."}, {"q": "Прямая y = 3x − 6 пересекает ось x при…", "options": ["x = −2", "x = 0", "x = 6", "x = 2"], "answer": 3, "explain": "На оси x значение y равно 0. 3x − 6 = 0."}]},
