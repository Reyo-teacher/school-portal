<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 класс — Математика — Портал Логунова Г.В.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Только для страницы класса (остальное в style.css) */
.intro{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.intro .owl{font-size:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.chap{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;padding:18px 20px;border-radius:22px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.2);transition:.15s;-webkit-tap-highlight-color:transparent}
.chap:hover{transform:translateY(-4px);box-shadow:0 10px 0 rgba(0,0,0,.2)}
.chap:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.badge{flex:none;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.28);font-size:21px;font-weight:800}
.c-title{font-size:18px;font-weight:800;line-height:1.3}
.c-sub{font-size:14px;font-weight:700;opacity:.95}
.list{display:grid;gap:12px}
.tp{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:18px;text-decoration:none;color:#fff;font-size:17px;font-weight:800;line-height:1.3;
  background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 5px 0 rgba(0,0,0,.2);transition:.15s}
a.tp:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
a.tp:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tp .badge{width:52px;height:52px;font-size:17px}
.soon{background:#f1f5f9;color:#64748b;box-shadow:none;border:2.5px dashed #cbd5e1;font-weight:700}
.soon .badge{background:#e2e8f0;color:#64748b}
.pill{margin-left:auto;flex:none;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;background:#e2e8f0;color:#64748b}
.ok .pill{background:#fff;color:var(--c2)}
.c0{--c1:#0284c7;--c2:#1d4ed8}.c1{--c1:#16a34a;--c2:#15803d}.c2{--c1:#ea580c;--c2:#c2410c}
.c3{--c1:#9333ea;--c2:#7e22ce}.c4{--c1:#db2777;--c2:#be185d}.c5{--c1:#0d9488;--c2:#0f766e}
</style>
</head>
<body>
<div class="wrapper">
  <header><h1 class="teacher-name">Логунов Григорий Владимирович — Математика, 5 класс</h1></header>

  <div class="card">
    <a class="back-btn" id="back" href="math.html">← К выбору класса</a>
    <h2 id="title"></h2>
    <div class="intro"><span class="owl">🦉</span><div class="bubble" id="hint"></div></div>
    <div id="app"></div>
  </div>
</div>

<script>
/* ============ ДАННЫЕ ============
   GRADE — номер класса. Для 6 класса скопируйте файл, назовите grade-6.html и поставьте GRADE = 6.
   READY — номера тем, для которых уже есть страница topic-КЛАСС-ГЛАВА-ТЕМА.html (например, topic-5-1-3.html).
   Новая тема готова? Добавьте её номер в READY, и она станет кнопкой. */
const GRADE = 5;
const READY = ['1.1', '1.2'];

const CH = [
  { t: 'Натуральные числа и нуль', tp: [
    'Натуральные числа и нуль',
    'Координатный луч. Изображение натуральных чисел и числа нуль на координатном луче',
    'Сравнение натуральных чисел. Двойное неравенство',
    'Сложение и вычитание натуральных чисел',
    'Умножение и деление натуральных чисел. Основное свойство частного',
    'Свойства арифметических действий',
    'Арифметические действия над натуральными числами',
    'Числовые выражения. Буквенные выражения',
    'Упрощение выражений',
    'Уравнение',
    'Формулы. Вычисление по формулам',
    'Числовые последовательности'] },
  { t: 'Делимость натуральных чисел', tp: [
    'Делители натурального числа. Кратные натурального числа',
    'Простые числа. Составные числа',
    'Основные свойства делимости',
    'Признаки делимости натуральных чисел на 2, 5 и 10',
    'Признаки делимости натуральных чисел на 3 и на 9',
    'Степень числа',
    'Разложение составных чисел на простые множители',
    'Наибольший общий делитель. Взаимно простые числа',
    'Наименьшее общее кратное',
    'Движение по реке'] },
  { t: 'Обыкновенные дроби и действия над ними', tp: [
    'Обыкновенная дробь. Чтение и запись обыкновенных дробей',
    'Основное свойство дроби. Сокращение дробей',
    'Правильные дроби. Неправильные дроби',
    'Смешанные числа',
    'Сложение и вычитание обыкновенных дробей с одинаковыми знаменателями',
    'Сложение и вычитание смешанных чисел',
    'Вычитание дроби из натурального числа',
    'Сложение и вычитание обыкновенных дробей с разными знаменателями'] },
  { t: 'Десятичные дроби и действия над ними', tp: [
    'Понятие десятичной дроби',
    'Сравнение десятичных дробей',
    'Сложение и вычитание десятичных дробей',
    'Умножение десятичных дробей',
    'Деление десятичных дробей',
    'Округление чисел',
    'Среднее арифметическое'] },
  { t: 'Отношения и пропорции. Проценты', tp: [
    'Отношение двух чисел',
    'Проценты',
    'Пропорция',
    'Прямая и обратная пропорциональные зависимости',
    'Окружность и круг',
    'Шар и сфера'] },
  { t: 'Положительные и отрицательные числа. Координаты на плоскости', tp: [
    'Положительные и отрицательные числа',
    'Координатная прямая',
    'Модуль числа',
    'Сравнение рациональных чисел',
    'Сложение и вычитание рациональных чисел',
    'Умножение и деление рациональных чисел',
    'Прямоугольная система координат на плоскости'] }
];
const ROM = ['I', 'II', 'III', 'IV', 'V', 'VI'];
const FINAL = 'Итоговое повторение курса математики за 5 класс';

/* ============ ОТРИСОВКА ============ */
const $ = s => document.querySelector(s);
const isReady = (c, t) => READY.includes(`${c + 1}.${t + 1}`);

function showChapters() {
  $('#title').textContent = `${GRADE} класс. Выбери раздел`;
  $('#hint').textContent = 'Выбирай раздел, а внутри найдёшь темы с лекциями и тренажёрами!';
  $('#back').textContent = '← К выбору класса'; $('#back').href = 'math.html';
  $('#app').innerHTML = '<div class="grid">' + CH.map((c, i) => {
    const done = c.tp.filter((_, j) => isReady(i, j)).length;
    return `<a class="chap c${i}" href="#ch${i + 1}"><span class="badge">${ROM[i]}</span>
      <span><span class="c-title">${c.t}</span><br><span class="c-sub">Тем: ${c.tp.length} · готово: ${done}</span></span></a>`;
  }).join('') + `<div class="tp soon"><span class="badge">🏁</span><span>${FINAL}</span><span class="pill">Скоро</span></div></div>`;
}

function showTopics(i) {
  const c = CH[i];
  $('#title').textContent = `Раздел ${ROM[i]}. ${c.t}`;
  $('#hint').textContent = 'Выбирай тему. Серые темы появятся совсем скоро!';
  $('#back').textContent = '← К разделам'; $('#back').href = '#';
  $('#app').innerHTML = '<div class="list">' + c.tp.map((t, j) => {
    const n = `${i + 1}.${j + 1}`;
    return isReady(i, j)
      ? `<a class="tp ok c${i}" href="topic-${GRADE}-${i + 1}-${j + 1}.html"><span class="badge">${n}</span><span>${t}</span><span class="pill">Открыть</span></a>`
      : `<div class="tp soon"><span class="badge">${n}</span><span>${t}</span><span class="pill">Скоро</span></div>`;
  }).join('') + '</div>';
}

function render() {                      // раздел выбирается через адрес вида grade-5.html#ch1
  const m = /^#ch(\d)$/.exec(location.hash), i = m ? +m[1] - 1 : -1;
  CH[i] ? showTopics(i) : showChapters();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
